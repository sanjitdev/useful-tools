<!doctype html>
<!--
  scripts/palette-search-smoke.html
  =================================
  Story 3.1 — Runtime smoke harness for the palette search contract.
  Loads the same JS fixtures as a real tool page and exercises the
  12 contract assertions in a real DOM (no stubs). The Node driver
  `scripts/_smoke_palette_search.js` mirrors the same checks via
  vm.createContext; the HTML harness is the authoritative UI smoke.

    1. HT.palette.* public API surface (matchActions / runAction / openHelp)
    2. HT.search._matchRange returns {start,end} on title match
    3. HT.search._matchRange returns null on no-match
    4. Top-5 cap from HT.search result shape
    5. Empty query returns []
    6. No-match query returns []
    7. Live region exists in static markup (UX-DR-18 / AC-7)
    8. Live region carries aria-live="polite"
    9. Forced-colors 2px cursor border exists in components-core.css (AI-17 / AC-9)
   10. Palette options carry aria-selected initial state
   11. Palette footer carries the chord hints (AC-8)
   12. Warm-path perf <= 10ms/query (AC-12)
   13. JS-driven render: HT.palette.open() + 'input' event renders
       exactly 5 [role=option] rows for query "qr" (top-5 cap
       exercised end-to-end) and the live region announces a summary.

  Run via:

    python -m http.server 8000 -d <repo-root>
    open http://localhost:8000/scripts/palette-search-smoke.html?ci=1

  The harness sets `window.__htPaletteSmokeFailed = <count>` so a
  wrapping runner can pick it up. When `?ci=1` is set, the harness
  fails loudly on any contract violation.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Palette Search Smoke Harness</title>
  <link rel="stylesheet" href="../assets/css/components-core.css">
  <script src="../assets/js/storage-registry.js"></script>
  <script src="../assets/js/utils.js"></script>
  <script src="../assets/js/url.js"></script>
  <script src="../assets/js/history.js"></script>
  <script src="../assets/js/sample-data.js"></script>
  <script src="../assets/js/share.js"></script>
  <script src="../assets/js/a11y.js"></script>
  <script src="../assets/js/palette-actions.js"></script>
  <script src="../assets/js/search.js"></script>
  <script type="application/json" id="ht-tools-json-inline">

<body>
  <h1>Palette Search Smoke Harness</h1>
  <p>Open with <code>?ci=1</code> to fail CI on contract violation. Exercises the Story 3.1 palette wiring.</p>
  <pre id="ht-smoke-log" style="white-space: pre-wrap; font-family: ui-monospace, monospace; font-size: 13px; line-height: 1.4;"></pre>

  <!-- Inline palette DOM so the harness exercises real CSS / ARIA wiring.
       Mirrors the chrome include byte-for-byte so the static markup
       checks run against the same shape as a real page. -->
  <div class="shell-palette" id="palette" role="combobox" aria-haspopup="listbox" aria-owns="palette-listbox" aria-expanded="false" aria-label="Command palette" hidden>
    <div class="shell-palette-panel">
      <input class="shell-palette-input" id="palette-input" type="search" role="searchbox" aria-controls="palette-listbox" aria-activedescendant="" aria-autocomplete="list" placeholder="Search tools…" autocomplete="off" spellcheck="false" />
      <ul class="shell-palette-list" id="palette-listbox" role="listbox" aria-label="Tools">
        <li class="shell-palette-empty" role="presentation">No recent tools yet</li>
      </ul>
      <div id="palette-live" class="shell-sr-only" aria-live="polite" aria-atomic="true"></div>
      <div class="shell-palette-footer">↑↓ Navigate · Enter Open · Esc Close · ? Help</div>
    </div>
  </div>

  <script>
    (function () {
      'use strict';

      const log = document.getElementById('ht-smoke-log');
      const out = (line) => {
        log.textContent += line + '\n';
        try { console.log(line); } catch (_) {}
      };
      let failed = 0;
      const pass = (name) => out('  PASS    ' + name);
      const fail = (name, why) => {
        out('  FAIL    ' + name + ' --- ' + why);
        failed += 1;
      };

      const isCi = (function () {
        try {
          if (window.location && window.location.search) {
            return new URLSearchParams(window.location.search).get('ci') === '1';
          }
        } catch (_) {}
        return false;
      })();

      out('palette-search-smoke: starting' + (isCi ? ' (CI mode)' : ''));

      async function resolveSync(results) {
        if (results && typeof results.then === 'function') {
          return results.then(function (r) { return r; });
        }
        return Promise.resolve(results);
      }

      async function run() {
        try {
          // ---- Test 1: HT.palette public API surface (AC-11) ----
          try {
            const p = window.HT && window.HT.palette;
            if (!p) {
              fail('palette API surface', 'HT.palette missing');
            } else if (
              typeof p.matchActions !== 'function' ||
              typeof p.runAction !== 'function' ||
              typeof p.openHelp !== 'function'
            ) {
              fail('palette API surface', 'matchActions=' + typeof p.matchActions + ', runAction=' + typeof p.runAction + ', openHelp=' + typeof p.openHelp);
            } else {
              pass('palette API surface (matchActions/runAction/openHelp)');
            }
          } catch (err) { fail('palette API surface', err.message); }

          // ---- Test 2: HT.search._matchRange returns {start,end} ----
          try {
            if (typeof window.HT.search._matchRange !== 'function') {
              fail('_matchRange exists', 'not a function');
            } else {
              const r = window.HT.search._matchRange('comp', 'Compound Interest');
              if (r && typeof r.start === 'number' && typeof r.end === 'number') {
                pass('_matchRange returns {start,end} on title match');
              } else {
                fail('_matchRange returns {start,end}', 'got ' + JSON.stringify(r));
              }
            }
          } catch (err) { fail('_matchRange returns {start,end}', err.message); }

          // ---- Test 3: HT.search._matchRange returns null on no-match ----
          try {
            const r = window.HT.search._matchRange('xyzzy', 'Compound Interest');
            if (r === null) {
              pass('_matchRange returns null on no-match');
            } else {
              fail('_matchRange null on no-match', 'got ' + JSON.stringify(r));
            }
          } catch (err) { fail('_matchRange null on no-match', err.message); }

          // ---- Test 4: top-5 cap result shape ----
          try {
            const r = await resolveSync(window.HT.search('qr'));
            // Fixture has 5 qr-* tools. Engine returns all 5 (ranked).
            // The render-time cap slices to top-5 in Test 13 below; here
            // we assert the engine surface and that the top hit is the
            // expected high-priority tool.
            if (Array.isArray(r) && r.length === 5 && r.every((x) => x.slug.indexOf('qr-') === 0) && r[0].slug === 'qr-code-generator') {
              pass('top-5 cap: "qr" -> 5 qr-* tools, top = qr-code-generator');
            } else {
              fail('top-5 cap engine surface', 'got n=' + (r && r.length) + ' top=' + (r && r[0] && r[0].slug));
            }
          } catch (err) { fail('top-5 cap', err.message); }

          // ---- Test 5: empty query ----
          try {
            const r = await resolveSync(window.HT.search(''));
            if (Array.isArray(r) && r.length === 0) {
              pass('empty query returns []');
            } else {
              fail('empty query', 'got ' + JSON.stringify(r));
            }
          } catch (err) { fail('empty query', err.message); }

          // ---- Test 6: no-match query ----
          try {
            const r = await resolveSync(window.HT.search('xyzzy-not-found'));
            if (Array.isArray(r) && r.length === 0) {
              pass('no-match query returns []');
            } else {
              fail('no-match query', 'got ' + JSON.stringify(r));
            }
          } catch (err) { fail('no-match query', err.message); }

          // ---- Test 7: live region exists (AC-7) ----
          try {
            const live = document.getElementById('palette-live');
            if (live) {
              pass('live region #palette-live present in static markup');
            } else {
              fail('live region exists', '#palette-live missing');
            }
          } catch (err) { fail('live region exists', err.message); }

          // ---- Test 8: live region carries aria-live="polite" ----
          try {
            const live = document.getElementById('palette-live');
            if (live && live.getAttribute('aria-live') === 'polite') {
              pass('live region aria-live="polite"');
            } else {
              fail('live region aria-live', 'got ' + (live && live.getAttribute('aria-live')));
            }
          } catch (err) { fail('live region aria-live', err.message); }

          // ---- Test 9: forced-colors cursor border (AC-9 / AI-17) ----
          // Story 4 Phase 5: the cursor border rule was moved from the
          // monolithic components.css into chrome-palette.css. Fetch
          // both the always-on core CSS and the lazy palette CSS so we
          // verify the rule is reachable at runtime.
          try {
            const [coreCss, paletteCss] = await Promise.all([
              fetch('../assets/css/components-core.css').then((r) => r.text()),
              fetch('../assets/css/chrome-palette.css').then((r) => r.text()),
            ]);
            const combined = coreCss + paletteCss;
            const hasSelector = /\[aria-selected=["']true["']\]/.test(combined);
            const hasBorder = /border\s*:\s*[^;}]*solid\s+CanvasText/.test(combined);
            if (hasSelector && hasBorder) {
              pass('forced-colors 2px CanvasText border on [aria-selected="true"]');
            } else {
              fail('forced-colors cursor border', 'selector=' + hasSelector + ', border=' + hasBorder);
            }
          } catch (err) { fail('forced-colors cursor border', err.message); }

          // ---- Test 10: palette options have aria-selected initial state ----
          // Note: in the static markup, only the empty row exists
          // (role="presentation"). The options are JS-rendered. Verify
          // the input has aria-activedescendant="" so SR can hook in.
          try {
            const input = document.getElementById('palette-input');
            if (input && input.getAttribute('aria-activedescendant') === '') {
              pass('palette input aria-activedescendant="" initial state');
            } else {
              fail('palette input aria-activedescendant', 'got ' + (input && input.getAttribute('aria-activedescendant')));
            }
          } catch (err) { fail('palette input aria-activedescendant', err.message); }

          // ---- Test 11: palette footer carries chord hints (AC-8) ----
          try {
            const footer = document.querySelector('.shell-palette-footer');
            const text = footer && footer.textContent;
            if (text && text.indexOf('Navigate') !== -1 && text.indexOf('Enter') !== -1) {
              pass('palette footer carries chord hints');
            } else {
              fail('palette footer chord hints', 'got ' + JSON.stringify(text));
            }
          } catch (err) { fail('palette footer chord hints', err.message); }

          // ---- Test 12: warm-path perf (AC-12) ----
          try {
            await resolveSync(window.HT.search('inflation')); // pre-warm
            const queries = ['inflation', 'comp', 'qr', 'tip', 'INFLATION', 'compound interest', 'creme', 'tip', 'compund', 'compund'];
            const t0 = performance.now();
            for (const q of queries) await resolveSync(window.HT.search(q));
            const t1 = performance.now();
            const per = (t1 - t0) / queries.length;
            if (per <= 10) {
              pass('warm path: ' + per.toFixed(2) + 'ms/query (10 queries)');
            } else {
              // Always fail loud: warm-path perf is a hard AC-12
              // guarantee, not a soft target. The CI gate was redundant
              // (CI is the only context that calls this harness with
              // intent to fail); local runs should also fail so a
              // regression is caught on the next dev edit.
              fail('warm path', per.toFixed(2) + 'ms/query exceeds 10ms target');
            }
          } catch (err) { fail('warm path', err.message); }

          // ---- Test 13: JS-driven palette render (top-5 cap rendered) ----
          // Calls HT.palette.open() to install wiring, dispatches a
          // synthetic 'input' event on #palette-input, waits past the
          // 50ms debounce, then asserts the listbox contains exactly 5
          // [role="option"] rows. Catches regressions where the render
          // path drifts from the engine contract (e.g., the .slice(0,5)
          // cap in renderPaletteList becomes .slice(0,10)).
          try {
            const palette = document.getElementById('palette');
            const input = document.getElementById('palette-input');
            const listbox = document.getElementById('palette-listbox');
            const live = document.getElementById('palette-live');
            if (!palette || !input || !listbox) {
              fail('JS-driven render: palette DOM', 'palette/input/listbox missing');
            } else if (!window.HT.palette || typeof window.HT.palette.open !== 'function') {
              fail('JS-driven render: HT.palette.open', 'not a function (shell.js not loaded?)');
            } else {
              window.HT.palette.open();
              input.value = 'qr';
              input.dispatchEvent(new Event('input', { bubbles: true }));
              await new Promise((res) => setTimeout(res, 120)); // > 50ms debounce
              const options = listbox.querySelectorAll('[role="option"]');
              if (options.length === 5) {
                pass('JS-driven render: 5 [role=option] rows after typing "qr"');
              } else {
                fail('JS-driven render: top-5 cap', 'got ' + options.length + ' rows');
              }
              // Live region should transition to a non-empty summary
              // string (UX-DR-18 / AC-7). Empty after typing means the
              // announce path is broken — SR users see no feedback.
              if (live && live.textContent && live.textContent.length > 0) {
                pass('JS-driven render: live region announces ("' + live.textContent.slice(0, 60) + '")');
              } else {
                fail('JS-driven render: live region announce', 'textContent="' + (live && live.textContent) + '"');
              }
              // Close to leave the DOM clean for subsequent runs.
              if (typeof window.HT.palette.close === 'function') window.HT.palette.close();
            }
          } catch (err) { fail('JS-driven render', err.message); }

          // ---- Test 14 (Story 3.2 AC-1/AC-6/AC-7): action row rendered ----
          // Story 3.2-review patch #1 / Task 8.2: typing 'theme' must
          // surface the theme.toggle action row (data-kind="action",
          // data-action-id="theme.toggle") with an icon span. Also
          // verifies the top-5 cap on tools does NOT count toward the
          // action group (AC-7).
          try {
            const palette = document.getElementById('palette');
            const input = document.getElementById('palette-input');
            const listbox = document.getElementById('palette-listbox');
            if (!palette || !input || !listbox) {
              fail('action row: palette DOM', 'palette/input/listbox missing');
            } else if (typeof window.HT.palette.open !== 'function') {
              fail('action row: HT.palette.open', 'not a function');
            } else {
              window.HT.palette.open();
              input.value = 'theme';
              input.dispatchEvent(new Event('input', { bubbles: true }));
              await new Promise((res) => setTimeout(res, 120)); // > 50ms debounce
              const actionRows = listbox.querySelectorAll('[role="option"][data-kind="action"]');
              if (actionRows.length >= 1) {
                pass('action row: at least 1 [data-kind="action"] row after typing "theme"');
              } else {
                fail('action row: data-kind="action" present', 'got ' + actionRows.length + ' action rows');
              }
              const themeRow = listbox.querySelector('[data-action-id="theme.toggle"]');
              if (themeRow) {
                pass('action row: theme.toggle action row present (data-action-id)');
              } else {
                fail('action row: theme.toggle data-action-id', 'row not found');
              }
              // Patch #11: icon span renders inside the action row.
              if (themeRow && themeRow.querySelector('.shell-palette-icon[data-icon="theme"]')) {
                pass('action row: theme.icon span rendered');
              } else {
                fail('action row: theme.icon span', 'span missing or data-icon wrong');
              }
              // Patch #12: aria-hidden="true" on the icon span.
              const iconSpan = themeRow && themeRow.querySelector('.shell-palette-icon');
              if (iconSpan && iconSpan.getAttribute('aria-hidden') === 'true') {
                pass('action row: icon span carries aria-hidden="true"');
              } else {
                fail('action row: icon aria-hidden', 'missing or wrong value');
              }
              // The matchActions result is frozen + has no run on the wire.
              const actionRowsTest = window.HT.palette.matchActions('theme');
              if (Array.isArray(actionRowsTest) && Object.isFrozen(actionRowsTest)) {
                pass('matchActions result array frozen (DOM harness)');
              } else {
                fail('matchActions result array frozen', 'isFrozen=' + Object.isFrozen(actionRowsTest));
              }
              if (actionRowsTest.length > 0 && Object.isFrozen(actionRowsTest[0]) && !('run' in actionRowsTest[0])) {
                pass('matchActions row: frozen + no run');
              } else {
                fail('matchActions row frozen + no run', 'row=' + JSON.stringify(actionRowsTest[0]));
              }
              if (typeof window.HT.palette.close === 'function') window.HT.palette.close();
            }
          } catch (err) { fail('action row', err.message); }

          // ---- Test 15 (Story 3.2 AC-3): no-match query, no actions ----
          // Typing 'xyzzy' must produce 0 action rows; the empty-state
          // row remains visible.
          try {
            const palette = document.getElementById('palette');
            const input = document.getElementById('palette-input');
            const listbox = document.getElementById('palette-listbox');
            if (palette && input && listbox && typeof window.HT.palette.open === 'function') {
              window.HT.palette.open();
              input.value = 'xyzzy';
              input.dispatchEvent(new Event('input', { bubbles: true }));
              await new Promise((res) => setTimeout(res, 120));
              const actionRows = listbox.querySelectorAll('[role="option"][data-kind="action"]');
              if (actionRows.length === 0) {
                pass('no-match query: 0 action rows after typing "xyzzy"');
              } else {
                fail('no-match query: 0 action rows', 'got ' + actionRows.length);
              }
              const empty = listbox.querySelector('.shell-palette-empty');
              if (empty && empty.textContent && empty.textContent.indexOf('xyzzy') !== -1) {
                pass('no-match query: empty-state row visible with "xyzzy"');
              } else {
                fail('no-match query: empty-state', 'textContent="' + (empty && empty.textContent) + '"');
              }
              if (typeof window.HT.palette.close === 'function') window.HT.palette.close();
            }
          } catch (err) { fail('no-match query', err.message); }

          // ---- Test 16 (Story 3.2 AC-2): action row click closes palette ----
          // Clicking an action row should close the palette (the
          // palette's own dispatcher closes before invoking runAction).
          try {
            const palette = document.getElementById('palette');
            const input = document.getElementById('palette-input');
            const listbox = document.getElementById('palette-listbox');
            if (palette && input && listbox && typeof window.HT.palette.open === 'function') {
              window.HT.palette.open();
              input.value = 'theme';
              input.dispatchEvent(new Event('input', { bubbles: true }));
              await new Promise((res) => setTimeout(res, 120));
              const themeRow = listbox.querySelector('[data-action-id="theme.toggle"]');
              // Stub HT.theme.cycle so the action no-ops instead of
              // mutating the document (the harness has no FOUC IIFE).
              if (window.HT && window.HT.theme) {
                window.HT.theme = Object.freeze({ cycle: () => 'no-op' });
              }
              if (themeRow) {
                themeRow.click();
                await new Promise((res) => setTimeout(res, 50));
                if (!window.HT.palette.isOpen()) {
                  pass('action row click closes the palette');
                } else {
                  fail('action row click closes palette', 'still open after click');
                }
              } else {
                fail('action row click: theme row not found', 'listbox query returned null');
              }
            }
          } catch (err) { fail('action row click closes palette', err.message); }

        } catch (err) {
          fail('harness setup', err.message);
        }

        out('');
        if (failed === 0) {
          out('palette-search-smoke: all tests pass');
          window.__htPaletteSmokeFailed = 0;
        } else {
          out('palette-search-smoke: ' + failed + ' test(s) failed');
          window.__htPaletteSmokeFailed = failed;
        }
      }

      // Wait for the deferred shell.js to load + boot.
      if (document.readyState === 'complete') {
        setTimeout(run, 50);
      } else {
        window.addEventListener('load', function () { setTimeout(run, 50); });
      }
    })();
  </script>
</body>
</html>
