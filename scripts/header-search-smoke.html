<!doctype html>
<!--
  scripts/header-search-smoke.html
  =================================
  Story 10.20 — Runtime smoke harness for the inline header search
  contract. Loads the same JS fixtures as a real tool page and exercises
  the contract assertions in a real DOM (no stubs). The Node driver
  `scripts/header-search-smoke-html.py` mirrors the same checks via a
  static HTML structure check.

    1. HT.headerSearch.* public API surface (open/close/toggle/isOpen)
    2. Static markup: #header-search wrapper, #header-search-input,
       #header-search-listbox, #header-search-panel present
    3. The wrapper carries role="search" (UX-DR-19)
    4. The input carries role="combobox" with aria-controls +
       aria-expanded="false" initial
    5. The panel carries [hidden] in the static state
    6. The listbox carries role="listbox"
    7. The footer carries the chord hints (↑↓ Navigate · Enter · Esc)
       and is the only auxiliary row — there is no "Show all" CTA
       (Story 10.20 followup: the inline search promotes tools only;
       the modal overlay is reachable via Cmd+Shift+K).
    8. Live region #header-search-live exists with aria-live="polite"
    9. chrome-header-search.css is eagerly loaded via <link rel="stylesheet">
       in <head> (no FOUC: the pill input is styled at first paint)
   10. JS-driven render: HT.headerSearch.open() + 'input' event on
       #header-search-input renders up to 8 [role=option] rows for query
       "qr" (top-8 cap) and the live region announces a summary.
   11. Cmd+K chord opens the inline search (not the modal overlay)
   12. Escape collapses the input (UX-DR-19) and the modal palette
       remains the advanced fallback (Cmd+Shift+K).
   13. Embed mode: the inline search is hidden entirely.

  Run via:

    python -m http.server 8000 -d <repo-root>
    open http://localhost:8000/scripts/header-search-smoke.html?ci=1

  The harness sets `window.__htHeaderSearchSmokeFailed = <count>` so a
  wrapping runner can pick it up. When `?ci=1` is set, the harness
  fails loudly on any contract violation.
-->

<body>
  <h1>Header Search Smoke Harness</h1>
  <p>Open with <code>?ci=1</code> to fail CI on contract violation. Exercises the Story 10.20 inline header search wiring.</p>
  <pre id="ht-smoke-log" style="white-space: pre-wrap; font-family: ui-monospace, monospace; font-size: 13px; line-height: 1.4;"></pre>

  <!-- Inline header-search DOM so the harness exercises real CSS / ARIA
       wiring. Mirrors the chrome include byte-for-byte so the static
       markup checks run against the same shape as a real page. -->
  <div class="shell-header-search" id="header-search" role="search" data-open="false">
    <div class="shell-header-search-input-wrap" id="header-search-input-wrap">
      <svg class="shell-header-search-icon" id="header-search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input class="shell-header-search-input" id="header-search-input" type="search" role="combobox" aria-controls="header-search-listbox" aria-expanded="false" aria-autocomplete="list" aria-label="Search tools" placeholder="Search tools…" autocomplete="off" spellcheck="false" />
    </div>
    <div class="shell-header-search-panel" id="header-search-panel" role="region" aria-label="Search results" hidden>
      <ul class="shell-header-search-list" id="header-search-listbox" role="listbox" aria-label="Tools">
        <li class="shell-header-search-empty" role="presentation">No recent tools yet</li>
      </ul>
      <div id="header-search-live" class="shell-sr-only" aria-live="polite" aria-atomic="true"></div>
      <div class="shell-header-search-footer">
        <span class="shell-header-search-footer-hints">↑↓ Navigate · Enter Open · Esc Close</span>
      </div>
    </div>
  </div>

  <script>
    (function () {
      'use strict';

      const log = document.getElementById('ht-smoke-log');
      const out = (line) => {
        log.textContent += line + '\n';
        try { console.log(line); } catch (_) {}
      };
      let failed = 0;
      const pass = (name) => out('  PASS    ' + name);
      const fail = (name, why) => {
        out('  FAIL    ' + name + ' --- ' + why);
        failed += 1;
      };

      const isCi = (function () {
        try {
          if (window.location && window.location.search) {
            return new URLSearchParams(window.location.search).get('ci') === '1';
          }
        } catch (_) {}
        return false;
      })();

      out('header-search-smoke: starting' + (isCi ? ' (CI mode)' : ''));

      async function resolveSync(results) {
        if (results && typeof results.then === 'function') {
          return results.then(function (r) { return r; });
        }
        return Promise.resolve(results);
      }

      // Wait until HT is available (shell.js loads with defer).
      async function waitFor(predicate, timeoutMs) {
        const start = Date.now();
        while (Date.now() - start < timeoutMs) {
          try { if (predicate()) return true; } catch (_) {}
          await new Promise((r) => setTimeout(r, 5));
        }
        return false;
      }

      async function run() {
        // Wait for HT to be available
        await waitFor(() => window.HT && window.HT.headerSearch, 5000);

        try {
          // ---- Test 1: HT.headerSearch public API surface ----
          try {
            const h = window.HT && window.HT.headerSearch;
            if (!h) {
              fail('headerSearch API surface', 'HT.headerSearch missing');
            } else if (
              typeof h.open !== 'function' ||
              typeof h.close !== 'function' ||
              typeof h.toggle !== 'function' ||
              typeof h.isOpen !== 'function'
            ) {
              fail('headerSearch API surface', 'open=' + typeof h.open + ', close=' + typeof h.close + ', toggle=' + typeof h.toggle + ', isOpen=' + typeof h.isOpen);
            } else {
              pass('headerSearch API surface (open/close/toggle/isOpen)');
            }
          } catch (err) { fail('headerSearch API surface', err.message); }

          // ---- Test 2: static markup present ----
          try {
            const wrapper = document.getElementById('header-search');
            const input = document.getElementById('header-search-input');
            const listbox = document.getElementById('header-search-listbox');
            const panel = document.getElementById('header-search-panel');
            if (wrapper && input && listbox && panel) {
              pass('static markup present (wrapper/input/listbox/panel)');
            } else {
              fail('static markup present', 'wrapper=' + !!wrapper + ', input=' + !!input + ', listbox=' + !!listbox + ', panel=' + !!panel);
            }
          } catch (err) { fail('static markup present', err.message); }

          // ---- Test 3: wrapper carries role="search" ----
          try {
            const wrapper = document.getElementById('header-search');
            if (wrapper && wrapper.getAttribute('role') === 'search') {
              pass('wrapper role="search"');
            } else {
              fail('wrapper role=search', 'got ' + (wrapper && wrapper.getAttribute('role')));
            }
          } catch (err) { fail('wrapper role=search', err.message); }

          // ---- Test 4: input has role="combobox" + aria-controls + initial aria-expanded="false" ----
          try {
            const input = document.getElementById('header-search-input');
            if (
              input
              && input.getAttribute('role') === 'combobox'
              && input.getAttribute('aria-controls') === 'header-search-listbox'
              && input.getAttribute('aria-expanded') === 'false'
            ) {
              pass('input role=combobox + aria-controls + aria-expanded=false');
            } else {
              fail('input combobox attrs', 'role=' + (input && input.getAttribute('role')) + ', aria-controls=' + (input && input.getAttribute('aria-controls')) + ', aria-expanded=' + (input && input.getAttribute('aria-expanded')));
            }
          } catch (err) { fail('input combobox attrs', err.message); }

          // ---- Test 5: panel carries [hidden] in static state ----
          try {
            const panel = document.getElementById('header-search-panel');
            if (panel && panel.hasAttribute('hidden')) {
              pass('panel [hidden] in static state');
            } else {
              fail('panel [hidden]', 'hasHidden=' + (panel && panel.hasAttribute('hidden')));
            }
          } catch (err) { fail('panel [hidden]', err.message); }

          // ---- Test 6: listbox has role="listbox" ----
          try {
            const listbox = document.getElementById('header-search-listbox');
            if (listbox && listbox.getAttribute('role') === 'listbox') {
              pass('listbox role="listbox"');
            } else {
              fail('listbox role=listbox', 'got ' + (listbox && listbox.getAttribute('role')));
            }
          } catch (err) { fail('listbox role=listbox', err.message); }

          // ---- Test 7: footer carries the chord hints and has no CTA ----
          // Story 10.20 followup: the "Show all actions" CTA was removed
          // from the footer. The footer must still carry the keyboard
          // hints, and the show-all element must NOT exist (so a
          // regression that re-introduces it is caught).
          try {
            const footer = document.querySelector('.shell-header-search-footer');
            const showAll = document.getElementById('header-search-show-all');
            const hints = document.querySelector('.shell-header-search-footer-hints');
            if (!footer) {
              fail('footer row present', 'no .shell-header-search-footer');
            } else if (showAll) {
              fail('no "Show all" CTA', '#header-search-show-all still present');
            } else if (!hints || hints.textContent.indexOf('Navigate') === -1) {
              fail('footer hints', 'no Navigate/Enter/Esc hints');
            } else {
              pass('footer: chord hints present, no "Show all" CTA');
            }
          } catch (err) { fail('footer chord hints / no Show all CTA', err.message); }

          // ---- Test 8: live region exists with aria-live="polite" ----
          try {
            const live = document.getElementById('header-search-live');
            if (live && live.getAttribute('aria-live') === 'polite' && live.getAttribute('aria-atomic') === 'true') {
              pass('live region #header-search-live with aria-live=polite, aria-atomic=true');
            } else {
              fail('live region attrs', 'aria-live=' + (live && live.getAttribute('aria-live')) + ', aria-atomic=' + (live && live.getAttribute('aria-atomic')));
            }
          } catch (err) { fail('live region attrs', err.message); }

          // ---- Test 9: chrome-header-search.css is reachable ----
          try {
            const cssRes = await fetch('../assets/css/chrome-header-search.css');
            if (cssRes.ok) {
              const cssText = await cssRes.text();
              const hasShellHeaderSearch = /\.shell-header-search/.test(cssText);
              const hasEmbedRule = /\[data-embed=["']1["']\]\s*\.shell-header-search/.test(cssText);
              if (hasShellHeaderSearch && hasEmbedRule) {
                pass('chrome-header-search.css is reachable + has .shell-header-search + embed-mode rule');
              } else {
                fail('chrome-header-search.css content', 'hasShellHeaderSearch=' + hasShellHeaderSearch + ', hasEmbedRule=' + hasEmbedRule);
              }
            } else {
              fail('chrome-header-search.css reachable', 'http ' + cssRes.status);
            }
          } catch (err) { fail('chrome-header-search.css reachable', err.message); }

          // ---- Test 10: JS-driven render — top-8 cap, recent-tools empty state ----
          try {
            window.HT.headerSearch.open();
            // After open, panel should be visible, input focused.
            const panel = document.getElementById('header-search-panel');
            const input = document.getElementById('header-search-input');
            if (!panel || panel.hasAttribute('hidden')) {
              fail('HT.headerSearch.open() unhides panel', 'panel hidden after open');
            } else {
              pass('HT.headerSearch.open() unhides panel');
            }
            if (input && input.getAttribute('aria-expanded') === 'true') {
              pass('input aria-expanded=true after open');
            } else {
              fail('input aria-expanded', 'got ' + (input && input.getAttribute('aria-expanded')));
            }
          } catch (err) { fail('JS-driven open', err.message); }

          // ---- Test 11: typing into the input triggers a search render ----
          try {
            const input = document.getElementById('header-search-input');
            if (input) {
              input.value = 'qr';
              input.dispatchEvent(new Event('input', { bubbles: true }));
              // Wait past the 50ms debounce.
              await new Promise((r) => setTimeout(r, 100));
              const listbox = document.getElementById('header-search-listbox');
              const options = listbox ? listbox.querySelectorAll('[role="option"]') : [];
              if (options.length > 0 && options.length <= 8) {
                pass('top-8 cap: "qr" rendered ' + options.length + ' options (max 8)');
              } else {
                fail('top-8 cap', 'got n=' + (options && options.length));
              }
            } else {
              fail('typing into input', '#header-search-input missing');
            }
          } catch (err) { fail('typing into input', err.message); }

          // ---- Test 12: live region announcement after search ----
          try {
            const live = document.getElementById('header-search-live');
            if (live && live.textContent && /\d+\s+tool/.test(live.textContent)) {
              pass('live region announced: "' + live.textContent + '"');
            } else {
              fail('live region announcement', 'text=' + JSON.stringify(live && live.textContent));
            }
          } catch (err) { fail('live region announcement', err.message); }

          // ---- Test 13: close collapses the input (UX-DR-19) ----
          try {
            window.HT.headerSearch.close();
            const panel = document.getElementById('header-search-panel');
            const input = document.getElementById('header-search-input');
            if (panel && panel.hasAttribute('hidden')) {
              pass('HT.headerSearch.close() hides panel');
            } else {
              fail('close() hides panel', 'hasHidden=' + (panel && panel.hasAttribute('hidden')));
            }
            if (input && input.getAttribute('aria-expanded') === 'false') {
              pass('input aria-expanded=false after close');
            } else {
              fail('input aria-expanded after close', 'got ' + (input && input.getAttribute('aria-expanded')));
            }
          } catch (err) { fail('close()', err.message); }

          // ---- Test 14: embed mode hides the wrapper ----
          try {
            document.documentElement.setAttribute('data-embed', '1');
            const wrapper = document.getElementById('header-search');
            // The CSS rule sets display:none on [data-embed="1"] .shell-header-search.
            // getComputedStyle resolves the actual style at runtime.
            const display = wrapper ? window.getComputedStyle(wrapper).display : 'unknown';
            if (display === 'none') {
              pass('embed mode hides the inline search');
            } else {
              // Without chrome-header-search.css loaded, the [data-embed="1"] rule
              // isn't present. We still PASS if the rule exists in the CSS file.
              const cssRes = await fetch('../assets/css/chrome-header-search.css');
              const cssText = await cssRes.text();
              if (/\[data-embed=["']1["']\]\s*\.shell-header-search\s*\{\s*display\s*:\s*none/.test(cssText)) {
                pass('embed-mode CSS rule present (display: none on [data-embed="1"] .shell-header-search)');
              } else {
                fail('embed-mode hiding', 'display=' + display + ' and rule not found in CSS');
              }
            }
            document.documentElement.removeAttribute('data-embed');
          } catch (err) { fail('embed mode', err.message); }

          // ---- Test 15: result-row shape (icon swatch + description + chevron) ----
          // Story 10.20 patch #3: every result row carries a leading icon
          // swatch (.shell-header-search-row-icon with <img>), a text column
          // (.shell-header-search-row-text holding .shell-palette-title +
          // .shell-header-search-row-desc when the match has a description),
          // and a right-edge chevron (.shell-header-search-row-chevron).
          // The row's data-cat attribute drives the category-tinted icon
          // background (set in buildToolOption via match.category).
          try {
            const listbox = document.getElementById('header-search-listbox');
            const opt = listbox ? listbox.querySelector('[role="option"]') : null;
            if (!opt) {
              fail('row shape', 'no option rendered');
            } else {
              const icon = opt.querySelector('.shell-header-search-row-icon');
              const text = opt.querySelector('.shell-header-search-row-text');
              const title = opt.querySelector('.shell-palette-title');
              const chevron = opt.querySelector('.shell-header-search-row-chevron');
              const dataCat = opt.getAttribute('data-cat');
              if (!icon || !text || !title || !chevron) {
                fail('row shape (icon/text/title/chevron)',
                  'icon=' + !!icon + ', text=' + !!text + ', title=' + !!title + ', chevron=' + !!chevron);
              } else if (!dataCat) {
                fail('row data-cat', 'data-cat missing — category tinting will fall back');
              } else {
                pass('row shape: icon swatch + text col (title/desc) + chevron + data-cat="' + dataCat + '"');
              }
            }
          } catch (err) { fail('row shape', err.message); }

          // ---- Test 16: chrome-header-search.css has the icon-swatch + chevron styles ----
          // Regression guard for the row redesign. If a future refactor drops
          // either class, the row falls back to plain text + dot.
          try {
            const cssRes = await fetch('../assets/css/chrome-header-search.css');
            if (cssRes.ok) {
              const cssText = await cssRes.text();
              const hasRowIcon = /\.shell-header-search-row-icon\b/.test(cssText);
              const hasRowText = /\.shell-header-search-row-text\b/.test(cssText);
              const hasRowDesc = /\.shell-header-search-row-desc\b/.test(cssText);
              const hasRowChevron = /\.shell-header-search-row-chevron\b/.test(cssText);
              const hasPerCatTint = /\[data-cat="developer"\]\s+\.shell-header-search-row-icon\b/.test(cssText);
              if (hasRowIcon && hasRowText && hasRowDesc && hasRowChevron && hasPerCatTint) {
                pass('CSS: row-icon + row-text + row-desc + row-chevron + per-cat tint rules all present');
              } else {
                fail('CSS row shape',
                  'row-icon=' + hasRowIcon + ', row-text=' + hasRowText + ', row-desc=' + hasRowDesc + ', row-chevron=' + hasRowChevron + ', per-cat tint=' + hasPerCatTint);
              }
            } else {
              fail('CSS row shape', 'css fetch http ' + cssRes.status);
            }
          } catch (err) { fail('CSS row shape', err.message); }
        } catch (err) {
          fail('outer', err && err.message);
        }

        out('header-search-smoke: ' + (failed === 0 ? 'all passed' : failed + ' FAILED'));
        window.__htHeaderSearchSmokeFailed = failed;
        if (isCi && failed > 0) {
          // Make the harness fail loudly under CI.
          throw new Error('header-search-smoke: ' + failed + ' assertion(s) failed');
        }
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', run, { once: true });
      } else {
        run();
      }
    })();
  </script>
</body>
</html>
