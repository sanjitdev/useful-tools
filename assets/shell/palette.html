<!-- shell:palette -->
<!-- Canonical source for the command palette overlay.
     Mounted as a static include in every page by `scripts/shell-template.py`
     (mirrors the chrome.html header/footer convention). The drift check
     (`scripts/shell-drift-check.py`) extracts the region between the marker
     comments and byte-matches every page.

     ARIA pattern: WAI-ARIA 1.1 combobox + listbox (UX-DR-19). The wrapper is
     role="combobox" with aria-haspopup="listbox" + aria-owns pointing to the
     listbox id. The input is role="searchbox" with aria-controls pointing to
     the same listbox. Hidden + aria-hidden="true" in the static state —
     `assets/js/shell.js` toggles aria-expanded, [hidden], and aria-hidden
     when openPalette() / closePalette() run.

     The live region announces the result count on every result-set change
     (UX-DR-18 + EXPERIENCE.md line 486). The footer carries the chord hints
     and is meaningful AT content (aria-hidden removed when populated). -->
<div class="shell-palette" id="palette" role="combobox" aria-haspopup="listbox" aria-owns="palette-listbox" aria-expanded="false" aria-label="Command palette" hidden>
  <div class="shell-palette-panel">
    <input class="shell-palette-input" id="palette-input" type="search" role="searchbox" aria-controls="palette-listbox" aria-activedescendant="" aria-autocomplete="list" aria-label="Search tools" placeholder="Search tools…" autocomplete="off" spellcheck="false" />
    <ul class="shell-palette-list" id="palette-listbox" role="listbox" aria-label="Tools">
      <li class="shell-palette-empty" role="presentation">No recent tools yet</li>
    </ul>
    <div id="palette-live" class="shell-sr-only" aria-live="polite" aria-atomic="true"></div>
    <div class="shell-palette-footer">↑↓ Navigate · Enter Open · Esc Close · ? Help</div>
  </div>
</div>
<!-- /shell:palette -->
