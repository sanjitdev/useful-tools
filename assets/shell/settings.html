<!-- shell:settings -->
<!-- Canonical source for the Settings modal overlay (Story 1.8).
     Mounted as a static include in every page by `scripts/shell-template.py`
     (mirrors the palette.html convention). The drift check
     (`scripts/shell-drift-check.py`) extracts the region between the marker
     comments and byte-matches every page.

     ARIA pattern: WAI-ARIA 1.2 modal dialog. role="dialog", aria-modal="true",
     aria-labelledby points at the heading id. Hidden + aria-hidden="true" in
     the static state — `assets/js/shell.js` toggles [hidden] / aria-hidden
     when openSettings() / closeSettings() run.

     Settings fields:
       1. Theme          (LIVE — Story 1.8 wires; mirror of header toggle)
       2. Language       (LIVE — plain-string persistence; Story 7.7 wires translations)
       3. Reduced motion (LIVE — sets <html data-reduced-motion>)
       4. Default units  (LIVE — Story 3.5 wires; metric/imperial select)
       5. Default currency (LIVE — Story 3.5 wires; ISO-4217 select)
       6. Font scale     (LIVE — Story 3.5 wires; 0.85–1.4 range, 0.05 step)
       7. Clear all local data (LIVE — only consumer of SETTINGS_KEYS)

     Per AD-4 the settings UI never renders inside a tool page; the cog is
     hidden in ?embed=1 mode (AD-7). The modal opens via openSettings() from
     the header cog click handler at assets/js/shell.js. -->
<div id="shell-settings-modal" class="shell-settings-modal" role="dialog" aria-modal="true" aria-labelledby="settings-modal-title" aria-hidden="true" hidden>
  <div class="shell-settings-modal__backdrop" data-settings-dismiss></div>
  <div class="shell-settings-modal__panel" tabindex="-1">
    <header class="shell-settings-modal__header">
      <h2 id="settings-modal-title" class="shell-settings-modal__title">Settings</h2>
      <button type="button" class="shell-settings-modal__close" aria-label="Close settings" data-settings-dismiss>×</button>
    </header>

    <form class="shell-settings-modal__body" id="shell-settings-form" onsubmit="return false;">

      <!-- 1. Theme (LIVE — single <select> per Story 3.5 AC-1) -->
      <div class="shell-settings-field" data-setting-key="ht.theme">
        <label class="shell-settings-label" for="ht-theme">Theme</label>
        <div class="shell-settings-control">
          <select id="ht-theme" name="ht.theme" class="shell-settings-select">
            <option value="auto">Auto (follow system)</option>
            <option value="light">Light</option>
            <option value="dark">Dark</option>
          </select>
        </div>
      </div>

      <!-- 2. Language (LIVE read+write — JS populates from navigator.languages) -->
      <div class="shell-settings-field" data-setting-key="ht.locale">
        <label class="shell-settings-label" for="ht-locale">Language</label>
        <div class="shell-settings-control">
          <select id="ht-locale" name="ht.locale" class="shell-settings-select">
            <option value="en">English</option>
          </select>
        </div>
      </div>

      <!-- 3. Reduced motion (LIVE) -->
      <div class="shell-settings-field" data-setting-key="ht.reducedMotion">
        <label class="shell-settings-label" for="ht-reducedMotion">Reduce motion</label>
        <div class="shell-settings-control">
          <label class="shell-settings-checkbox"><input id="ht-reducedMotion" type="checkbox" name="ht.reducedMotion" value="1"> Disable animations and transitions</label>
        </div>
      </div>

      <!-- 4. Default units (LIVE — Story 3.5) -->
      <div class="shell-settings-field" data-setting-key="ht.units">
        <label class="shell-settings-label" for="ht-units">Default units</label>
        <div class="shell-settings-control">
          <select id="ht-units" name="ht.units" class="shell-settings-select">
            <option value="metric">Metric</option>
            <option value="imperial">Imperial</option>
          </select>
        </div>
      </div>

      <!-- 5. Default currency (LIVE — Story 3.5, ISO-4217 select) -->
      <div class="shell-settings-field" data-setting-key="ht.currency">
        <label class="shell-settings-label" for="ht-currency">Default currency</label>
        <div class="shell-settings-control">
          <select id="ht-currency" name="ht.currency" class="shell-settings-select">
            <option value="USD">USD — US Dollar</option>
            <option value="EUR">EUR — Euro</option>
            <option value="GBP">GBP — British Pound</option>
            <option value="JPY">JPY — Japanese Yen</option>
            <option value="CAD">CAD — Canadian Dollar</option>
            <option value="AUD">AUD — Australian Dollar</option>
            <option value="INR">INR — Indian Rupee</option>
            <option value="CNY">CNY — Chinese Yuan</option>
          </select>
        </div>
      </div>

      <!-- 6. Font scale (LIVE — Story 3.5, 0.85–1.4 step 0.05) -->
      <div class="shell-settings-field" data-setting-key="ht.fontScale">
        <label class="shell-settings-label" for="ht-fontScale">Font scale</label>
        <div class="shell-settings-control">
          <input id="ht-fontScale" type="range" name="ht.fontScale" min="0.85" max="1.4" step="0.05" value="1" aria-describedby="ht-fontScale-output">
          <output id="ht-fontScale-output" aria-live="polite">100%</output>
        </div>
      </div>

      <!-- 7. Clear all local data (LIVE — only consumer of SETTINGS_KEYS) -->
      <div class="shell-settings-field shell-settings-field--danger">
        <div class="shell-settings-control">
          <button type="button" id="shell-settings-clear" class="shell-settings-modal__danger">Clear all local data…</button>
        </div>
      </div>

    </form>
  </div>
</div>
<!-- /shell:settings -->
