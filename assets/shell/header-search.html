<!-- shell:header-search -->
<!-- Inline header search bar (Story 10.20 — UX rewrite).
     Mounted as a static include in every page by `scripts/shell-template.py`
     (mirrors the chrome.html header/footer convention). The drift check
     (`scripts/shell-drift-check.py`) extracts the region between the marker
     comments and byte-matches every page.

     ARIA pattern: WAI-ARIA 1.2 combobox + listbox (UX-DR-19). The wrapper
     is `role="search"` with the input as `role="combobox"` and the
     listbox as `role="listbox"`. Hidden + aria-hidden="true" in the
     static state — `assets/js/shell.js` toggles `data-open` on the
     wrapper, `[aria-expanded]` on the input, and `[hidden]` on the
     panel when `openHeaderSearch()` / `closeHeaderSearch()` run.

     The live region announces the result count on every result-set change
     (UX-DR-18). The footer carries the chord hints and is meaningful AT
     content (aria-hidden removed when populated). The footer is the only
     auxiliary row — there is no "Show all" link; the action surface
     (theme, settings, source, help, clear) lives behind the modal
     overlay (`Cmd+Shift+K`) which is not promoted from the inline
     search dropdown.

     Story 10.20 redesign: the input is ALWAYS visible (no icon-collapse
     trick). The icon sits inside the input-wrap as a leading visual cue.
     Clicking the input (or focusing it via `/`, Cmd+K) opens the panel;
     clicking the icon button is equivalent to clicking the input. The
     wrapper holds the icon + input together so they stay aligned
     regardless of layout context. The panel anchors to the right edge
     of the input wrap. -->
<div class="shell-header-search" id="header-search" role="search" data-open="false">
  <div class="shell-header-search-input-wrap" id="header-search-input-wrap">
    <svg class="shell-header-search-icon" id="header-search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input class="shell-header-search-input" id="header-search-input" type="search" role="combobox" aria-controls="header-search-listbox" aria-expanded="false" aria-autocomplete="list" aria-label="Search tools" placeholder="Search tools…" autocomplete="off" spellcheck="false" />
  </div>
  <div class="shell-header-search-panel" id="header-search-panel" role="region" aria-label="Search results" hidden>
    <ul class="shell-header-search-list" id="header-search-listbox" role="listbox" aria-label="Tools">
      <li class="shell-header-search-empty" role="presentation">No recent tools yet</li>
    </ul>
    <div id="header-search-live" class="shell-sr-only" aria-live="polite" aria-atomic="true"></div>
    <div class="shell-header-search-footer">
      <span class="shell-header-search-footer-hints">↑↓ Navigate · Enter Open · Esc Close</span>
    </div>
  </div>
</div>
<!-- /shell:header-search -->
