<!-- Blocking inline FOUC script. Must run before any stylesheet <link>.
     Reads localStorage.ht.theme (grandfathered per project-context.md §3),
     sets data-theme on <html>, and applies a first-paint background so the
     page never flashes white. ES5 syntax: this runs before shell.js (ES2018)
     and must not depend on anything external. -->
<script>(function(){try{var t=localStorage.getItem("ht.theme");var mqd=window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)");t=t==="light"||t==="dark"?t:(mqd&&mqd.matches?"dark":"light");var d=document.documentElement;d.setAttribute("data-theme",t);d.style.backgroundColor=t==="dark"?"#0f1117":"#f7f8fb";d.style.color=t==="dark"?"#e8eaf0":"#1a1d29";try{var em=null;try{var sp=new URLSearchParams(location.search).get("embed");if(sp!=null&&sp!==""&&sp!=="0"&&sp!=="false"){em=sp;}}catch(_){}if(em){d.setAttribute("data-embed",em);var uid;try{if(window.crypto&&typeof window.crypto.randomUUID==="function"){uid=window.crypto.randomUUID();}else{var b=new Array(16);for(var i=0;i<16;i+=1){b[i]=Math.floor(Math.random()*256);}b[6]=(b[6]&15)|64;b[8]=(b[8]&63)|128;var h="";for(var j=0;j<16;j+=1){var x=b[j].toString(16);h+=x.length===1?"0"+x:x;}uid=h.slice(0,8)+"-"+h.slice(8,12)+"-"+h.slice(12,16)+"-"+h.slice(16,20)+"-"+h.slice(20,32);}}catch(_){}if(uid){d.setAttribute("data-instance-uuid",uid);try{window.name="ht-embed-"+uid;}catch(_){}}}else if(/[?&]embed=1(?:&|$)/.test(location.search)){d.setAttribute("data-embed","1");}}catch(_){}try{var po=window.PerformanceObserver?new PerformanceObserver(function(list){try{var e=list.getEntries().find(function(x){return x.name==="first-paint"});if(e){d.dispatchEvent(new CustomEvent("ht:fouc-resolved",{detail:{elapsedMs:e.startTime}}));po.disconnect();}}catch(_){}}):null;if(po){po.observe({type:"paint",buffered:true});}}catch(_){}}catch(e){document.documentElement.setAttribute("data-theme","light")}})();</script>
