  <main id="main" class="shell-main" aria-label="Stopwatch & Timer" tabindex="-1">
    <div id="top"></div>
    <header class="tool-header">
      <a href="../../index.html" class="back-link">← All tools</a>
      <h1>Stopwatch &amp; Timer</h1>
      <p class="tool-subtitle">Precision stopwatch with laps, and a countdown timer that chimes when it finishes.</p>
    </header>

    <div class="tabs" role="tablist" id="mode-tabs">
      <button class="tab is-active" data-tab="stopwatch" type="button" role="tab">Stopwatch</button>
      <button class="tab" data-tab="timer" type="button" role="tab">Timer</button>
    </div>

    <div data-tab-panel="stopwatch">
      <div class="panel">
        <div class="display" id="sw-display">00:00:00.00</div>
        <div class="row" style="gap: var(--space-3); flex-wrap: wrap;">
          <button id="sw-start" class="btn btn-primary" type="button">Start</button>
          <button id="sw-lap" class="btn btn-ghost" type="button" disabled>Lap</button>
          <button id="sw-reset" class="btn btn-ghost" type="button" disabled>Reset</button>
        </div>
        <div id="sw-stats" class="row" style="gap: var(--space-4); margin-top: var(--space-3); flex-wrap: wrap;">
          <span class="badge">Laps: <strong id="sw-lap-count">0</strong></span>
        </div>
      </div>
      <div class="panel">
        <div class="panel-title">Laps</div>
        <ul id="sw-laps" class="laps"></ul>
      </div>
    </div>

    <div data-tab-panel="timer" style="display:none">
      <div class="panel">
        <div class="display" id="t-display">00:00</div>
        <div class="grid-3">
          <div class="field">
            <label class="field-label" for="t-min">Minutes</label>
            <input id="t-min" class="input" type="number" min="0" max="99" value="5">
          </div>
          <div class="field">
            <label class="field-label" for="t-sec">Seconds</label>
            <input id="t-sec" class="input" type="number" min="0" max="59" value="0">
          </div>
          <div class="field">
            <label class="field-label">&nbsp;</label>
            <button id="t-set" class="btn btn-ghost" type="button">Set</button>
          </div>
        </div>
        <div class="row" style="gap: var(--space-3); margin-top: var(--space-3); flex-wrap: wrap;">
          <button id="t-start" class="btn btn-primary" type="button">Start</button>
          <button id="t-pause" class="btn btn-ghost" type="button" disabled>Pause</button>
          <button id="t-reset" class="btn btn-ghost" type="button">Reset</button>
        </div>
        <div id="t-msg" class="muted" style="margin-top: var(--space-3);"></div>
      </div>
    </div>
  </main>
