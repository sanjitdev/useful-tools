<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Encode and decode URLs using encodeURI, encodeURIComponent, and decodeURIComponent.">
  <title>URL Codec · Handy Tools</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%234f46e5'/%3E%3Ctext x='50' y='66' font-family='Arial,sans-serif' font-size='52' font-weight='800' fill='white' text-anchor='middle'%3EH%3C/text%3E%3C/svg%3E">
  <script src="../../assets/js/theme-init.js"></script>

  <link rel="stylesheet" href="../../assets/css/base.css">
  <link rel="stylesheet" href="../../assets/css/components.css">
  <link rel="stylesheet" href="../../assets/css/tools.css">
  <link rel="stylesheet" href="./url-codec.css">
</head>
<body>
  <div id="site-header"></div>

  <main class="container">
    <header class="tool-header">
      <a href="../../index.html" class="back-link">← All tools</a>
      <h1>URL Codec</h1>
      <p class="tool-subtitle">Encode or decode URL strings with the right level of escaping.</p>
    </header>

    <div class="panel">
      <div class="panel-title">Input</div>
      <textarea id="url-input" class="textarea" placeholder="Enter a URL or text"></textarea>
      <div style="display:flex; gap: var(--space-2); margin-top: var(--space-3); flex-wrap: wrap;">
        <button id="url-encode-uri" class="btn btn-primary" type="button">encodeURI</button>
        <button id="url-encode-comp" class="btn" type="button">encodeURIComponent</button>
        <button id="url-decode" class="btn" type="button">decodeURIComponent</button>
        <button id="url-copy-input" class="btn btn-ghost" type="button">Copy input</button>
      </div>
    </div>

    <div class="panel">
      <div class="panel-title">Output</div>
      <textarea id="url-output" class="textarea" readonly placeholder="Result appears here"></textarea>
      <div style="display:flex; gap: var(--space-2); margin-top: var(--space-3); flex-wrap: wrap;">
        <button id="url-copy-output" class="btn btn-ghost" type="button">Copy output</button>
        <button id="url-swap" class="btn btn-ghost" type="button">Swap ↕</button>
      </div>
    </div>

    <div id="url-status"></div>
  </main>

  <div id="site-footer"></div>

  <script src="../../assets/js/utils.js"></script>
  <script src="../../assets/js/theme.js"></script>
  <script src="../../assets/js/layout.js"></script>
  <script src="./url-codec.js"></script>
</body>
</html>
