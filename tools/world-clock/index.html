<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Track the current time across multiple cities, plus a meeting-time finder to see what time it is everywhere at once.">
  <title>World Clock · Handy Tools</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%234f46e5'/%3E%3Ctext x='50' y='66' font-family='Arial,sans-serif' font-size='52' font-weight='800' fill='white' text-anchor='middle'%3EH%3C/text%3E%3C/svg%3E">
  <script>(function(){try{var t=localStorage.getItem("ht.theme");t=t||(window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");var d=document.documentElement;d.setAttribute("data-theme",t);d.style.backgroundColor=t==="dark"?"#0f1117":"#f7f8fb";d.style.color=t==="dark"?"#e8eaf0":"#1a1d29"}catch(e){document.documentElement.setAttribute("data-theme","light")}})();</script>

  <link rel="stylesheet" href="../../assets/css/base.css">
  <link rel="stylesheet" href="../../assets/css/components.css">
  <link rel="stylesheet" href="../../assets/css/tools.css">
  <link rel="stylesheet" href="./world-clock.css">
</head>
<body>
  <div id="site-header"></div>

  <main class="container">
    <header class="tool-header">
      <a href="../../index.html" class="back-link">← All tools</a>
      <h1>World Clock</h1>
      <p class="tool-subtitle">Pin multiple cities to the wall and find the perfect meeting time.</p>
    </header>

    <div class="panel">
      <div class="panel-title">Add a city</div>
      <div class="grid-3">
        <div class="field">
          <label class="field-label" for="wc-name">City label</label>
          <input id="wc-name" class="input" type="text" placeholder="e.g. London (home office)">
        </div>
        <div class="field" style="grid-column: span 2;">
          <label class="field-label" for="wc-tz">Timezone</label>
          <select id="wc-tz" class="select"></select>
        </div>
      </div>
      <button id="wc-add" class="btn btn-primary btn-sm" style="margin-top: var(--space-3);" type="button">Add city</button>
    </div>

    <div id="wc-list"></div>

    <div class="panel" style="margin-top: var(--space-5);">
      <div class="panel-title">Meeting time finder</div>
      <p class="muted text-sm" style="margin-bottom: var(--space-3);">Pick a date and time in your local timezone and see what time it is in each pinned city.</p>
      <div class="grid-3">
        <div class="field">
          <label class="field-label" for="wc-mtg-date">Date</label>
          <input id="wc-mtg-date" class="input" type="date">
        </div>
        <div class="field">
          <label class="field-label" for="wc-mtg-time">Local time</label>
          <input id="wc-mtg-time" class="input" type="time" value="12:00">
        </div>
        <div class="field">
          <label class="field-label">&nbsp;</label>
          <button id="wc-mtg-now" class="btn btn-ghost" type="button">Use now</button>
        </div>
      </div>
      <div id="wc-mtg-list" class="result-grid" style="margin-top: var(--space-4);"></div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="../../assets/js/utils.js"></script>
  <script src="../../assets/js/theme.js"></script>
  <script src="../../assets/js/layout.js"></script>
  <script src="./world-clock.js"></script>
</body>
</html>
