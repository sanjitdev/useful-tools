<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Encode and decode text using Base64 with full UTF-8 support.">
  <title>Base64 Codec · Handy Tools</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%234f46e5'/%3E%3Ctext x='50' y='66' font-family='Arial,sans-serif' font-size='52' font-weight='800' fill='white' text-anchor='middle'%3EH%3C/text%3E%3C/svg%3E">
  <script src="../../assets/js/theme-init.js"></script>

  <link rel="stylesheet" href="../../assets/css/base.css">
  <link rel="stylesheet" href="../../assets/css/components.css">
  <link rel="stylesheet" href="../../assets/css/tools.css">
  <link rel="stylesheet" href="./base64-codec.css">
</head>
<body>
  <div id="site-header"></div>

  <main class="container">
    <header class="tool-header">
      <a href="../../index.html" class="back-link">← All tools</a>
      <h1>Base64 Codec</h1>
      <p class="tool-subtitle">Encode and decode text using Base64. Full UTF-8 support.</p>
    </header>

    <div class="panel">
      <div class="panel-title">Text</div>
      <textarea id="b64-text" class="textarea" placeholder="Plain text input"></textarea>
      <div style="display:flex; gap: var(--space-2); margin-top: var(--space-3); flex-wrap: wrap;">
        <button id="b64-encode" class="btn btn-primary" type="button">Encode →</button>
        <button id="b64-copy-text" class="btn btn-ghost" type="button">Copy</button>
      </div>
    </div>

    <div class="panel">
      <div class="panel-title">Base64</div>
      <textarea id="b64-b64" class="textarea" placeholder="Base64 input"></textarea>
      <div style="display:flex; gap: var(--space-2); margin-top: var(--space-3); flex-wrap: wrap;">
        <button id="b64-decode" class="btn btn-primary" type="button">← Decode</button>
        <button id="b64-copy-b64" class="btn btn-ghost" type="button">Copy</button>
      </div>
    </div>

    <div id="b64-status"></div>
  </main>

  <div id="site-footer"></div>

  <script src="../../assets/js/utils.js"></script>
  <script src="../../assets/js/theme.js"></script>
  <script src="../../assets/js/layout.js"></script>
  <script src="./base64-codec.js"></script>
</body>
</html>
