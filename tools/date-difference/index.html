<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Calculate the exact difference between two dates in days, weeks, months, years, hours, or business days.">
  <title>Date Difference · Handy Tools</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%234f46e5'/%3E%3Ctext x='50' y='66' font-family='Arial,sans-serif' font-size='52' font-weight='800' fill='white' text-anchor='middle'%3EH%3C/text%3E%3C/svg%3E">
  <script src="../../assets/js/theme-init.js"></script>

  <link rel="stylesheet" href="../../assets/css/base.css">
  <link rel="stylesheet" href="../../assets/css/components.css">
  <link rel="stylesheet" href="../../assets/css/tools.css">
  <link rel="stylesheet" href="./date-difference.css">
</head>
<body>
  <div id="site-header"></div>

  <main class="container">
    <header class="tool-header">
      <a href="../../index.html" class="back-link">← All tools</a>
      <h1>Date Difference</h1>
      <p class="tool-subtitle">Count the time between two dates — in days, weeks, months, years, or business days.</p>
    </header>

    <div class="panel">
      <div class="panel-title">Pick a start and end date</div>
      <div class="grid-2">
        <div class="field">
          <label class="field-label" for="start">Start date</label>
          <input id="start" class="input" type="date">
        </div>
        <div class="field">
          <label class="field-label" for="end">End date</label>
          <input id="end" class="input" type="date">
        </div>
      </div>
      <div class="grid-2" style="margin-top: var(--space-3)">
        <label class="field" style="flex-direction:row; align-items:center; gap:8px; cursor:pointer;">
          <input id="include-end" type="checkbox" checked>
          <span>Include the end date</span>
        </label>
        <div class="field">
          <label class="field-label" for="unit">Display unit</label>
          <select id="unit" class="select">
            <option value="days" selected>Days</option>
            <option value="weeks">Weeks</option>
            <option value="months">Months</option>
            <option value="years">Years</option>
            <option value="hours">Hours</option>
            <option value="minutes">Minutes</option>
            <option value="seconds">Seconds</option>
            <option value="business-days">Business days (Mon–Fri)</option>
          </select>
        </div>
      </div>
      <div id="warn" class="warning" style="display:none"></div>
    </div>

    <div class="result-card">
      <div class="result-main" id="primary">—</div>
      <div class="result-sub" id="sub">Pick two dates to begin.</div>
      <div class="result-grid">
        <div class="result-tile"><div class="result-tile-label">Years</div><div class="result-tile-value" id="t-years">—</div></div>
        <div class="result-tile"><div class="result-tile-label">Months</div><div class="result-tile-value" id="t-months">—</div></div>
        <div class="result-tile"><div class="result-tile-label">Days</div><div class="result-tile-value" id="t-days">—</div></div>
        <div class="result-tile"><div class="result-tile-label">Business days</div><div class="result-tile-value" id="t-bdays">—</div></div>
        <div class="result-tile"><div class="result-tile-label">Weeks</div><div class="result-tile-value" id="t-weeks">—</div></div>
        <div class="result-tile"><div class="result-tile-label">Total hours</div><div class="result-tile-value" id="t-hours">—</div></div>
        <div class="result-tile"><div class="result-tile-label">Total minutes</div><div class="result-tile-value" id="t-minutes">—</div></div>
        <div class="result-tile"><div class="result-tile-label">Total seconds</div><div class="result-tile-value" id="t-seconds">—</div></div>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="../../assets/js/utils.js"></script>
  <script src="../../assets/js/theme.js"></script>
  <script src="../../assets/js/layout.js"></script>
  <script src="./date-difference.js"></script>
</body>
</html>
