<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Calculate tip and split a bill across multiple people, with an optional round-up shortcut.">
  <title>Tip Calculator · Handy Tools</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%234f46e5'/%3E%3Ctext x='50' y='66' font-family='Arial,sans-serif' font-size='52' font-weight='800' fill='white' text-anchor='middle'%3EH%3C/text%3E%3C/svg%3E">
  <script>(function(){try{var t=localStorage.getItem("ht.theme");t=t||(window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");var d=document.documentElement;d.setAttribute("data-theme",t);d.style.backgroundColor=t==="dark"?"#0f1117":"#f7f8fb";d.style.color=t==="dark"?"#e8eaf0":"#1a1d29"}catch(e){document.documentElement.setAttribute("data-theme","light")}})();</script>

  <link rel="stylesheet" href="../../assets/css/base.css">
  <link rel="stylesheet" href="../../assets/css/components.css">
  <link rel="stylesheet" href="../../assets/css/tools.css">
  <link rel="stylesheet" href="./tip-calculator.css">
</head>
<body>
  <div id="site-header"></div>

  <main class="container">
    <header class="tool-header">
      <a href="../../index.html" class="back-link">← All tools</a>
      <h1>Tip Calculator</h1>
      <p class="tool-subtitle">Compute tip, total, and a fair split for the table.</p>
    </header>

    <div class="panel">
      <div class="panel-title">Bill details</div>
      <div class="grid-2">
        <div class="field">
          <label class="field-label" for="bill">Bill amount</label>
          <input id="bill" class="input" type="number" min="0" step="any" value="56.40">
        </div>
        <div class="field">
          <label class="field-label" for="tip">Tip percentage</label>
          <input id="tip" class="input" type="number" min="0" step="any" value="18">
          <div class="field-hint">Percent of the bill (e.g. 18 for 18%).</div>
        </div>
      </div>
      <div class="grid-2" style="margin-top: var(--space-3);">
        <div class="field">
          <label class="field-label" for="people">Number of people</label>
          <input id="people" class="input" type="number" min="1" step="1" value="3">
        </div>
        <div class="field">
          <label class="field-label" for="round">Round up each share</label>
          <label class="checkbox" style="margin-top: 6px;">
            <input id="round" type="checkbox">
            <span>Round each person's amount up to the next cent</span>
          </label>
        </div>
      </div>
    </div>

    <div class="result-card">
      <div class="result-main" id="per-person">$0.00</div>
      <div class="result-sub" id="per-person-sub">Per person</div>
      <hr class="divider">
      <div class="result-grid">
        <div class="result-tile">
          <div class="result-tile-label">Tip amount</div>
          <div class="result-tile-value" id="tip-amount">$0.00</div>
        </div>
        <div class="result-tile">
          <div class="result-tile-label">Total bill</div>
          <div class="result-tile-value" id="total">$0.00</div>
        </div>
        <div class="result-tile">
          <div class="result-tile-label">Per person (exact)</div>
          <div class="result-tile-value" id="per-person-exact">$0.00</div>
        </div>
        <div class="result-tile">
          <div class="result-tile-label">Effective tip / person</div>
          <div class="result-tile-value" id="per-person-tip">$0.00</div>
        </div>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="../../assets/js/utils.js"></script>
  <script src="../../assets/js/theme.js"></script>
  <script src="../../assets/js/layout.js"></script>
  <script src="./tip-calculator.js"></script>
</body>
</html>
