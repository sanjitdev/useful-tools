    <div class="panel">

      <div class="grid-3">

          <label class="field-label" for="count">Count</label>

          <div style="display:flex; flex-direction:column; gap: 6px;">
            <label class="checkbox">
              <input id="classic" type="checkbox" checked>
              <span>Start with Lorem ipsum</span>
            </label>
            <label class="checkbox">
              <input id="html" type="checkbox">
              <span>Output as HTML &lt;p&gt;</span>
            </label>
          </div>
        </div>
      </div>
      <div style="display:flex; gap: var(--space-2); margin-top: var(--space-3); flex-wrap: wrap;">
        <button id="generate" class="btn btn-primary" type="button">Generate</button>
        <button id="copy" class="btn" type="button">Copy output</button>
