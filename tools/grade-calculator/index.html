<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Compute weighted course grades, letter grade with plus/minus, and what you need on a final to hit a target.">
  <title>Grade Calculator · Handy Tools</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%234f46e5'/%3E%3Ctext x='50' y='66' font-family='Arial,sans-serif' font-size='52' font-weight='800' fill='white' text-anchor='middle'%3EH%3C/text%3E%3C/svg%3E">
  <script>(function(){try{var t=localStorage.getItem("ht.theme");t=t||(window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");var d=document.documentElement;d.setAttribute("data-theme",t);d.style.backgroundColor=t==="dark"?"#0f1117":"#f7f8fb";d.style.color=t==="dark"?"#e8eaf0":"#1a1d29"}catch(e){document.documentElement.setAttribute("data-theme","light")}})();</script>

  <link rel="stylesheet" href="../../assets/css/base.css">
  <link rel="stylesheet" href="../../assets/css/components.css">
  <link rel="stylesheet" href="../../assets/css/tools.css">
  <link rel="stylesheet" href="./grade-calculator.css">
</head>
<body>
  <div id="site-header"></div>

  <main class="container">
    <header class="tool-header">
      <a href="../../index.html" class="back-link">← All tools</a>
      <h1>Grade Calculator</h1>
      <p class="tool-subtitle">Add weighted assignments, see your running grade, and plan the final.</p>
    </header>

    <div class="panel">
      <div class="panel-title">Assignments</div>
      <div id="rows" class="rows"></div>
      <div style="display:flex; gap: var(--space-2); margin-top: var(--space-3); flex-wrap: wrap;">
        <button id="add-row" class="btn btn-sm" type="button">+ Add assignment</button>
        <button id="clear-all" class="btn btn-sm btn-ghost" type="button">Clear all</button>
      </div>
      <div id="weight-warn"></div>
    </div>

    <div class="result-card">
      <div class="result-main" id="final-grade">—</div>
      <div class="result-sub" id="letter-grade">—</div>
      <div class="result-sub" id="weight-summary">—</div>
    </div>

    <div class="panel">
      <div class="panel-title">What do you need on the final?</div>
      <div class="grid-3">
        <div class="field">
          <label class="field-label" for="target">Target grade (%)</label>
          <input id="target" class="input" type="number" min="0" max="150" step="any" value="90">
        </div>
        <div class="field">
          <label class="field-label" for="final-weight">Final weight (%)</label>
          <input id="final-weight" class="input" type="number" min="0" max="100" step="any" value="30">
        </div>
        <div class="field">
          <label class="field-label">&nbsp;</label>
          <button id="compute-needed" class="btn btn-primary" type="button">Compute</button>
        </div>
      </div>
      <div id="needed-result" class="result-card" style="margin-top: var(--space-3); display:none;"></div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="../../assets/js/utils.js"></script>
  <script src="../../assets/js/theme.js"></script>
  <script src="../../assets/js/layout.js"></script>
  <script src="./grade-calculator.js"></script>
</body>
</html>
