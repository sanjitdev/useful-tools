<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Track daily habits with a 30-day heatmap, current streak, and per-habit completions stored locally.">
  <title>Habit Tracker · Handy Tools</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%234f46e5'/%3E%3Ctext x='50' y='66' font-family='Arial,sans-serif' font-size='52' font-weight='800' fill='white' text-anchor='middle'%3EH%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="../../assets/css/base.css">
  <link rel="stylesheet" href="../../assets/css/components.css">
  <link rel="stylesheet" href="../../assets/css/tools.css">
  <link rel="stylesheet" href="./habit-tracker.css">
</head>
<body>
  <div id="site-header"></div>

  <main class="container">
    <header class="tool-header">
      <a href="../../index.html" class="back-link">← All tools</a>
      <h1>Habit Tracker</h1>
      <p class="tool-subtitle">Pick habits, mark each day, watch the streak grow.</p>
    </header>

    <div class="panel">
      <div class="panel-title">Add a habit</div>
      <div class="grid-3">
        <div class="field" style="grid-column: span 2;">
          <label class="field-label" for="habit-name">Name</label>
          <input id="habit-name" class="input" type="text" placeholder="e.g. Read 20 minutes" value="Drink water">
        </div>
        <div class="field">
          <label class="field-label" for="habit-emoji">Emoji (optional)</label>
          <input id="habit-emoji" class="input" type="text" maxlength="2" placeholder="💧" value="💧">
        </div>
      </div>
      <button id="add-habit" class="btn btn-primary btn-sm" style="margin-top: var(--space-3);" type="button">Add habit</button>
    </div>

    <div id="habit-list"></div>
  </main>

  <div id="site-footer"></div>

  <script src="../../assets/js/utils.js"></script>
  <script src="../../assets/js/theme.js"></script>
  <script src="../../assets/js/layout.js"></script>
  <script src="./habit-tracker.js"></script>
</body>
</html>
