<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Calculate compound interest growth with optional monthly contributions, year-by-year table, and effective annual rate.">
  <title>Compound Interest Calculator · Handy Tools</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%234f46e5'/%3E%3Ctext x='50' y='66' font-family='Arial,sans-serif' font-size='52' font-weight='800' fill='white' text-anchor='middle'%3EH%3C/text%3E%3C/svg%3E">
  <script>(function(){try{var t=localStorage.getItem("ht.theme");t=t||(window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");var d=document.documentElement;d.setAttribute("data-theme",t);d.style.backgroundColor=t==="dark"?"#0f1117":"#f7f8fb";d.style.color=t==="dark"?"#e8eaf0":"#1a1d29"}catch(e){document.documentElement.setAttribute("data-theme","light")}})();</script>

  <link rel="stylesheet" href="../../assets/css/base.css">
  <link rel="stylesheet" href="../../assets/css/components.css">
  <link rel="stylesheet" href="../../assets/css/tools.css">
  <link rel="stylesheet" href="./compound-interest.css">
</head>
<body>
  <div id="site-header"></div>

  <main class="container">
    <header class="tool-header">
      <a href="../../index.html" class="back-link">← All tools</a>
      <h1>Compound Interest Calculator</h1>
      <p class="tool-subtitle">See how your money grows with compounding and regular contributions.</p>
    </header>

    <div class="panel">
      <div class="panel-title">Inputs</div>
      <div class="grid-3">
        <div class="field">
          <label class="field-label" for="principal">Initial principal</label>
          <input id="principal" class="input" type="number" min="0" step="any" value="1000">
        </div>
        <div class="field">
          <label class="field-label" for="monthly">Monthly contribution</label>
          <input id="monthly" class="input" type="number" min="0" step="any" value="200">
        </div>
        <div class="field">
          <label class="field-label" for="rate">Annual interest rate (%)</label>
          <input id="rate" class="input" type="number" min="0" max="100" step="any" value="7">
        </div>
        <div class="field">
          <label class="field-label" for="years">Years</label>
          <input id="years" class="input" type="number" min="0" max="100" step="1" value="30">
        </div>
        <div class="field">
          <label class="field-label" for="frequency">Compound frequency</label>
          <select id="frequency" class="select">
            <option value="365">Daily</option>
            <option value="12" selected>Monthly</option>
            <option value="4">Quarterly</option>
            <option value="2">Semi-annually</option>
            <option value="1">Annually</option>
          </select>
        </div>
        <div class="field">
          <label class="field-label" for="contrib-when">Contribution timing</label>
          <select id="contrib-when" class="select">
            <option value="end" selected>End of month</option>
            <option value="start">Beginning of month</option>
          </select>
        </div>
      </div>
    </div>

    <div class="result-card">
      <div class="result-main" id="final-balance">—</div>
      <div class="result-sub" id="final-summary">Enter values to see your projection.</div>
      <div class="result-grid">
        <div class="result-tile"><div class="result-tile-label">Total contributions</div><div class="result-tile-value" id="total-contrib">—</div></div>
        <div class="result-tile"><div class="result-tile-label">Total interest earned</div><div class="result-tile-value" id="total-interest">—</div></div>
        <div class="result-tile"><div class="result-tile-label">Effective annual rate</div><div class="result-tile-value" id="effective-rate">—</div></div>
        <div class="result-tile"><div class="result-tile-label">Growth multiple</div><div class="result-tile-value" id="growth-multiple">—</div></div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-title">Year-by-year breakdown</div>
      <div id="schedule-wrap" class="schedule-wrap"></div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="../../assets/js/utils.js"></script>
  <script src="../../assets/js/theme.js"></script>
  <script src="../../assets/js/layout.js"></script>
  <script src="./compound-interest.js"></script>
</body>
</html>
