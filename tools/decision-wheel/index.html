<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Spin a colorful wheel to make a choice. Add options, one per line, and let the wheel decide.">
  <title>Decision Wheel · Handy Tools</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%234f46e5'/%3E%3Ctext x='50' y='66' font-family='Arial,sans-serif' font-size='52' font-weight='800' fill='white' text-anchor='middle'%3EH%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="../../assets/css/base.css">
  <link rel="stylesheet" href="../../assets/css/components.css">
  <link rel="stylesheet" href="../../assets/css/tools.css">
  <link rel="stylesheet" href="./decision-wheel.css">
</head>
<body>
  <div id="site-header"></div>

  <main class="container">
    <header class="tool-header">
      <a href="../../index.html" class="back-link">← All tools</a>
      <h1>Decision Wheel</h1>
      <p class="tool-subtitle">Feed in some options, give the wheel a spin, let fate decide.</p>
    </header>

    <div class="grid-2">
      <div class="panel">
        <div class="panel-title">Options (one per line)</div>
        <textarea id="dw-input" class="textarea" rows="8" placeholder="Pizza&#10;Tacos&#10;Sushi"></textarea>
        <div class="row" style="margin-top: var(--space-3); flex-wrap: wrap;">
          <button id="dw-add" class="btn btn-primary btn-sm" type="button">Add single option</button>
          <button id="dw-reset" class="btn btn-ghost btn-sm" type="button">Reset to defaults</button>
        </div>
        <div class="field" style="margin-top: var(--space-3);">
          <label class="field-label" for="dw-new">Quick add</label>
          <div class="row" style="gap: var(--space-2);">
            <input id="dw-new" class="input" type="text" placeholder="Type and press Enter" style="flex:1;">
          </div>
        </div>
      </div>

      <div class="panel">
        <div class="panel-title">Wheel</div>
        <div class="wheel-wrap">
          <div class="wheel-pointer" aria-hidden="true"></div>
          <svg id="dw-wheel" class="wheel" viewBox="-110 -110 220 220" role="img" aria-label="Decision wheel"></svg>
        </div>
        <div class="row" style="margin-top: var(--space-3); justify-content: center; gap: var(--space-3); flex-wrap: wrap;">
          <button id="dw-spin" class="btn btn-primary" type="button">Spin</button>
          <button id="dw-clear" class="btn btn-ghost" type="button">Clear result</button>
        </div>
      </div>
    </div>

    <div class="result-card" id="dw-result-card">
      <div class="result-main" id="dw-result">—</div>
      <div class="result-sub" id="dw-result-sub">Spin the wheel to see your choice.</div>
    </div>

    <div class="panel" style="margin-top: var(--space-5);">
      <div class="panel-title">Manage options</div>
      <ul id="dw-list" class="list-reset"></ul>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="../../assets/js/utils.js"></script>
  <script src="../../assets/js/theme.js"></script>
  <script src="../../assets/js/layout.js"></script>
  <script src="./decision-wheel.js"></script>
</body>
</html>
