  workflow_dispatch:

# Read-only against the repo. The gate does not modify tools.json; it
# only inspects it. If a future change needs write access, scope it to
# the narrowest permission set possible (e.g., `contents: write` only
# for a release-tag job).
permissions:
  contents: read

# Don't cancel a running gate if a new commit lands on the same PR —
# cancellation can produce a misleading "cancelled" status in the PR
# check UI and obscure the real failure.
concurrency:
  group: tool-contract-gate
  cancel-in-progress: false

jobs:
  gate:
    name: Tool Contract Gate
    runs-on: ubuntu-latest

    # Bounded runtime: the gate is pure-stdlib Python + a workflow file
    # parse; 10 minutes is generous (a fresh checkout + setup-python
    # install finishes in ~30s) and protects the runner from a hung
    # `pip install` or runaway script.
    timeout-minutes: 10

    # The gate is a required status check on main (per FR-2). It is
    # wired in the repo's branch-protection settings; not in code.

    steps:
      # actions/checkout is pinned to a commit SHA for supply-chain
      # safety. The mutable tag v4.2.2 resolves to:
      #   11bd71901bbe5b1630ceea73d27597364c9af683
      # Bump the SHA only after auditing the new tag's diff against
      # the previously-pinned version.
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # actions/setup-python is pinned to a commit SHA. The mutable tag
      # v5.3.0 resolves to:
      #   0b93645e9fea7318ecaed2b359559ac225c90a2b
      - name: Setup Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.11"

      # actions/setup-node is pinned to a commit SHA. The mutable tag
      # v4.1.0 resolves to:
      #   1e44f9385a0d5f4dee9b2c12e9a38e9d6b5e566d
      # Required for the Story 1.12 site-config smoke step (Node loads
      # site-config.js in a vm context to assert frozen fields).
      - name: Setup Node
        uses: actions/setup-node@1e44f9385a0d5f4dee9b2c12e9a38e9d6b5e566d # v4.1.0
        with:
          node-version: "22"

      - name: Validate Site Data
        # Story 1.1: validate tools.json against tools.schema.json.
        # The validator's exit code propagates as the step's exit code;
        # any non-zero result fails the job and the PR check.
        run: make validate

      - name: Score all tools (mechanical)
        # Story 1.2: run the rubric linter for every entry in tools.json.
        # The report is informational at this step; the gate's
        # application-layer check (next step) is the enforcement point.
        run: make rubric-all

      - name: Enforce AD-2 gate
        # Story 1.3: the gate script reproduces the truth table from
        # docs/quality-rubric.md#Scoring & Gate. Exit 0 = all entries
        # pass (or all sub-8 entries are under unexpired waivers).
        # Non-zero = at least one entry violates the contract; the
        # PR cannot merge.
        run: make gate

      - name: Enforce storage registry gate (Story 1.10)
        # Story 1.10: verifies the localStorage key registry's manifest
        # integrity, the tools.json history-key cross-check, and every
        # HT.storage.* call site in assets/js/** + tools/<slug>/<slug>.js
        # against the registered keys. Exit 0 = all checks pass.
        run: make storage-registry

      - name: Enforce site-config gate (Story 1.12)
        # Story 1.12: verifies assets/js/site-config.js's
        # HT_SITE_CONFIG + HT.siteConfig shapes, the < 1024-byte
        # budget (AC #14), the api-contract.js entry at version 1.3.0,
        # and the site-config.js <script> tag + script-tag order on
        # every tool page and the home page. Exit 0 = all checks pass.
        run: make site-config

      - name: Smoke site-config.js frozen surface (Story 1.12)
        # Story 1.12: loads assets/js/site-config.js in a fresh vm
        # context, asserts every frozen field of HT_SITE_CONFIG +
        # HT.siteConfig, and verifies that mutation throws in strict
        # mode (AD-14 stable surface). The script's vacuous-pass guard
        # converts a hollow run into a hard failure.
        run: make site-config-smoke

      - name: Check Shell chrome drift (Story 1.18 / AI-E1-15)
        # Story 1.18 (Epic 1 retrofit audit AI-E1-15) replaced the
        # legacy byte-substring scan with a DOM-walk structuralidentity
        # comparator. The Python stdlib `html.parser` parses each
        # page, locates the five chrome landmarks (skip link, site
        # header, main, print-only footer, site footer) by structural
        # signature, and compares tag/attribute/text/nesting with
        # normalization rules (whitespace collapse, comment drop,
        # inline script/style content ignored, brand href + main
        # aria-label normalization). The `--allow-drift` exemptions
        # for index.html and view-source.html are no longer needed —
        # both pages pass cleanly without them. On drift, a JSON
        # report is written to .chrome-dom-diff.json at repo root
        # for machine inspection. The five non-DOM per-page checks
        # (search.js, site-config, data-slug, tools.json-inline,
        # manifest SHA) are preserved. See `_smoke_chrome_dom_walk.js`
        # for the positive + negative test battery.
        run: make shell-drift

      - name: Smoke chrome DOM walk (Story 1.18 / AI-E1-15)
        # Story 1.18 AC-5: prove the structural comparator and
        # normalization rules are real and not vacuous. Builds a
        # temp repo with 6 fixture pages (canonical + missing
        # landmark + extra inline script + whitespace drift + attr
        # drift + root-page-kind) and asserts: 4 ok lines, 2 drift
        # detections (missing-landmark + attr-drift), and the diff
        # report names the specific landmark/attribute. 8 PASS
        # expected. Vacuous-pass guard catches hollow runs.
        run: make chrome-dom-smoke

      - name: Check Shell a11y invariants (Story 1.5 code review)
        # Verifies AC #1's structural invariants that the byte-level
        # drift check cannot catch: <main aria-label> non-empty on
        # every page, plus the cobalt token block and dark-theme
        # override in assets/css/base.css. Added after the Story 1.5
        # code review (Decision #1).
        run: make shell-a11y

      - name: Smoke share-dialog surface (Story 2.5)
        # Story 2.5: loads assets/js/url.js + share.js in a fresh vm
        # context against a synthetic HT.homeGrid.entries fixture,
        # asserts the HT.share surface (AD-14 frozen — 9 stable + 1
        # internal), url/embedCode correctness, dialog lifecycle,
        # affordances, button factory, the HT.share.print wrapper,
        # the mount teardown helper, and api-contract.js at version
        # 1.8.0 with the 10 entries. 50 PASS expected. The script's
        # vacuous-pass guard (pass===0 && fail===0 → exit 1) means a
        # hollow run fails the gate.
        run: make share-dialog-smoke

      - name: Smoke wave-1 page wiring (Story 2.6)
        # Story 2.6: static Node smoke verifying each Wave-1 page
        # (qr-code-generator, inflation-calculator, lifespan-
        # simulator) is in tools.json with ready:true, score>=8,
        # urlState + history-keys + view-source.path, and that the
        # tool's index.html wires the Story 2.x Shell script tags
        # (share.js, a11y.js, shell.js, sample-data.js, history.js).
        # 43 PASS expected. The script's vacuous-pass guard
        # (pass===0 && fail===0 → exit 1) means a hollow run fails
        # the gate.
        run: make wave-1-smoke

      - name: Smoke wave-2 page wiring (Story 2.7)
        # Story 2.7: static Node smoke verifying each of the 15
        # Wave-2 tools (bd-tax-calculator, animal-race, …,
        # compound-interest) is in tools.json with ready:true,
        # score>=8, the per-tool contract fields (urlState.encode/
        # decode + history-keys + view-source + embed-snippet +
        # keywords + pack + icon), every encode/decode selector
        # resolves to an HTML id, and the tool's <slug>.css
        # contains @media print (rubric #5 Printable). 346 PASS
        # expected. Vacuous-pass guard (pass===0 && fail===0 →
        # exit 1) catches hollow runs.
        run: make wave-2-smoke

      - name: Smoke wave-3 page wiring (Story 2.8)
        # Story 2.8: static Node smoke verifying each of the 17
        # Wave-3 tools (json-formatter, color-tools, …, url-codec)
        # is in tools.json with ready:true, score>=8, the per-tool
        # contract fields, every encode/decode selector resolves to
        # an HTML id, and the tool's <slug>.css contains @media
        # print (rubric #5 Printable). 392 PASS expected. Vacuous-
        # pass guard (pass===0 && fail===0 → exit 1) catches
        # hollow runs.
        run: make wave-3-smoke

      - name: Audit pack tags (Story 2.9)
        # Story 2.9: verifies every ready:true entry in tools.json
        # declares a non-empty pack array with values from the
        # curated taxonomy {travel,finance,study,developer,household}
        # and that each pack has ≥ 3 tools. 111 PASS expected.
        # Vacuous-pass guard catches hollow runs.
        run: make pack-tags-smoke

      - name: Enforce ES5 anti-pattern gate (Story 2.10)
        # Story 2.10: scans assets/js/** for ES5 anti-patterns
        # (`var` declarations in the migrated shared files + `.concat(`
        # calls across all assets/js/**). Exits 1 if any are found.
        run: make es5-grep

      - name: Smoke quality scorecard
        # Story 2.11: /quality inventory view. Static checks on
        # quality.html (chrome footer link, <main aria-label>, empty-
        # table skeleton with 5 base <th> cells, zero inline
        # <tr data-ht-tool>, last-script assertion). Behavioral
        # checks: loads assets/js/quality.js in a vm context with
        # stubbed fetch + DOM, dispatches DOMContentLoaded, asserts
        # 2 rows × 15 <td> render with verbatim remediation text +
        # slug sort + waiver row class + frozen HT.quality surface.
        # The `make shell-drift` step earlier verifies quality.html's
        # chrome bytes match `assets/shell/chrome.html` (the drift
        # check is the AC-1 chrome-equivalence enforcement point).
        # Vacuous-pass guard catches hollow runs.
        run: make quality-smoke

      - name: Cross-cutting tool-JS regression sweep (Story 2.12)
        # Story 2.12: load every ready:true tool's <slug>.js in a fresh
        # vm context with a synthetic DOM + a minimal HT.* facade (the
        # top-22 HT.* helpers + the shell APIs the tool JS touches).
        # Run the 6-check battery — schema, HTML, JS load, HT.history
        # roundtrip, console.error gate, fetch gate (no external URLs).
        # Exits 0 only when all 35 ready:true tools pass all 6 checks
        # (210/210). The Python wrapper writes
        # `.regression-sweep-output.txt` so the Markdown report is
        # uploadable as a build artifact. The path filter covers
        # tools/**, assets/js/**, scripts/_smoke_regression_sweep.js,
        # scripts/_smoke_regression_sweep_negative.js,
        # scripts/_regression_sweep.py, and the workflow file itself.
        run: make regression-sweep

      - name: Regression-sweep negative-test battery (Story 2.12)
        # Proves each of the 6 regression-sweep checks is meaningful,
        # not vacuous. For each check, inject a known-broken fixture,
        # run the sweep, and assert the expected check flips to false.
        # 6 PASS expected. If any check stays true under its broken
        # fixture, the sweep has a vacuous pass and 210/210 is
        # meaningless — exit 1 fails the gate.
        run: make regression-sweep-negative

      - name: Smoke print stylesheet (Story 3.10)
        # Story 3.10: verifies assets/css/print.css exists and carries
        # every AC-required selector + color-forcing + page-break
        # rule; verifies the print.css <link media="print"> is present
        # on every tool page + the home page + quality.html; verifies
        # the print-only footer block is in chrome.html and spliced
        # into every tool page + the home page; verifies the legacy
        # @media print block was migrated out of base.css into
        # print.css; and verifies the splice_print_css +
        # splice_print_footer helpers exist in shell-template.py. 55
        # PASS expected. Vacuous-pass guard catches hollow runs.
        run: make print-smoke

      - name: Smoke view-source route (Story 3.11)
        # Story 3.11: verifies /view-source.html exists with the three
        # <pre><code> blocks + Download button + 404 region + script
        # tags in correct order; verifies view-source.js parses +
        # exposes HT.viewSource with the slug-validator regex +
        # rejects malformed input; verifies vendor/highlight.min.js
        # exposes HT.highlight and tokenizes HTML/CSS/JS; verifies
        # vendor/zip-store.js produces a valid PKZIP STORE archive
        # with the correct byte layout (per APPNOTE.TXT sections
        # 4.3.7 / 4.3.12 / 4.3.16) and a correct CRC-32 (0x3610A686
        # for "hello"); verifies tools.json has view-source.enabled
        # + path = tools/<slug>/index.html for every tool; verifies
        # wireViewSourceLink() targets /view-source?tool= ; verifies
        # chrome.html carries the dual-anchor footer pattern
        # (data-view-source-link + data-view-source-github); and
        # verifies api-contract.js is version 1.15.0 with the new
        # HT.viewSource + HT.highlight + HT.zipStore entries. 91
        # PASS expected. Vacuous-pass guard catches hollow runs.
        run: make view-source-smoke

      - name: Smoke pins-recent (Story 3.12)
        # Story 3.12: verifies recent.js exposes HT.recent with FIFO
        # cap 5, dedupe-before-cap, and writes via HT.storage under
        # handy-tools.recent; verifies pins.js exposes HT.pins with
        # {slug: iso8601} map, cap 9, most-recent-first ordering, and
        # writes via HT.storage under handy-tools.pins; verifies
        # home-grid.js renders the pinned row + per-card pin toggle
        # (sibling of anchor, not nested) and handles click delegation
        # idempotently; verifies shell.js calls markToolVisited() once
        # per boot and reads the slug from data-slug; verifies
        # home-sidebar.js populates <ol class="recent-list"> and hides
        # the <aside> when the list is empty; verifies index.html
        # carries the new <aside> + pinned <section> + 3 new script
        # tags in the correct order; verifies export.js + import.js
        # include both handy-tools.recent and handy-tools.pins
        # top-level keys (regression guard); verifies
        # api-contract.js version 1.16.0 with HT.recent + HT.pins +
        # HT.homeSidebar entries; verifies site-config-gate.py
        # expects 1.16.0; verifies storage-registry schemas
        # (handy-tools.pins is object<slug:iso8601>;
        # handy-tools.recent is array<string>); verifies
        # chrome.html inline manifest matches the JS registry.
        # 119 PASS expected. Vacuous-pass guard catches hollow runs.
        run: make pins-recent-smoke

      - name: Smoke search perf budget (Story 1.11 / AI-E1-14)
        # Story 1.11 + Epic 1 retrofit audit AI-E1-14: verifies the
        # search engine meets its published perf budgets. Cold path
        # (NFKD normalize dominates) ≤ 50ms/query across 5 fresh VM
        # invocations; warm path (Story 1.11 published budget) ≤
        # 10ms/query as a 90th-percentile-trimmed avg of 50 queries;
        # no-result boundary ≤ 25ms/query (10 zero-match queries,
        # returns [] each). 4 PASS expected. Vacuous-pass guard
        # (pass===0 && fail===0 → exit 1) catches hollow runs and
        # breaks the gate.
        run: make search-perf-smoke

      - name: AST walker self-test (Story 1.17 / AI-E1-13)
        # Story 1.17 + Epic 1 retrofit audit AI-E1-13: the vendored
        # acorn parser (scripts/vendor/acorn.js) + the wrapper walker
        # (scripts/vendor/ast-walker.js) replace the legacy regex
        # trio in shell-bounds-check.py + storage-registry-gate.py.
        # The walker's 15-fixture inline battery covers every branch:
        # comment-internal fetch / localStorage, string-internal
        # fetch, real localStorage.setItem, real fetch, every key-
        # resolution branch on HT.storage.<op> (literal, constant-
        # bound, template, unbound), parse error, registry-level ops
        # (list / clear / registerHistoryKeys), and dynamic-key
        # expressions (member expr, call expr, optional chaining).
        # 15 PASS expected. Vacuous-pass guard catches hollow runs.
        run: make ast-gates-self-test

      - name: AST gates negative-test battery (Story 1.17 AC-4)
        # Story 1.17 AC-4: proves the AST migration didn't regress
        # either gate's behavior. Builds a temp repo with three
        # fixture tool files (comment-only, string-only, real-call),
        # runs shell-bounds-check.py + storage-registry-gate.py
        # against it, and asserts: (a) the comment fixture shows 0
        # violations, (b) the string fixture shows 0 violations,
        # (c) the violation fixture shows 2 hits (localStorage +
        # fetch), (d) the storage-registry gate passes cleanly,
        # (e) the AST walker self-test still reports 15 passed. 7
        # PASS expected. This end-to-end harness catches any drift
        # in the Python gate subprocess contract (e.g., the JSON
        # output format from the AST walker). Vacuous-pass guard
        # catches hollow runs.
        run: make ast-gates-negative

      - name: Upload regression sweep report
        # Story 2.12 AC-7: when the sweep fails (or passes) the
        # Markdown report at the repo root should be downloadable
        # from the Actions UI for post-mortem analysis. Always upload
        # even on success — the report doubles as a tool-by-tool
        # health snapshot for the build.
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.4.3
        with:
          name: regression-sweep-report
          path: .regression-sweep-output.txt
          if-no-files-found: warn
          retention-days: 14
