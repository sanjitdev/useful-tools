      - "scripts/_smoke_regression_sweep_negative.js"
      - "scripts/_regression_sweep.py"
      - "scripts/_smoke_print.js"
      - "scripts/_smoke_view_source.js"
      - "view-source.html"
      - "scripts/_smoke_pins_recent.js"
      - "scripts/_smoke_search_perf.js"
      - "scripts/vendor/acorn.js"
      - "scripts/vendor/acorn.LICENSE"
      - "scripts/vendor/ast-walker.js"
      - "scripts/_smoke_ast_gates.js"
      - "scripts/_smoke_chrome_dom_walk.js"
      - "assets/js/recent.js"
      - "assets/js/pins.js"
      - "assets/js/home-sidebar.js"
      - "assets/js/quality.js"
      - "assets/js/utils.js"
      - "assets/js/storage.js"
      - "assets/js/history.js"
      - "assets/js/share.js"
      - "assets/js/a11y.js"
      - "assets/js/shell.js"
      - "assets/js/api-contract.js"
      - "assets/js/search.js"
