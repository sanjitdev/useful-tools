      - "quality.html"
      - "docs/quality-rubric.md"
      - "docs/ci-gate.md"
      - ".github/workflows/tool-contract-gate.yml"
      - "tools/**"
      - "Makefile"
  push:
    branches: [ main ]
    paths:
      - "tools.json"
      - "tools.schema.json"
      - "scripts/validate-tools-json.py"
      - "scripts/rubric-lint.py"
      - "scripts/tool-contract-gate.py"
      - "scripts/shell-template.py"
      - "scripts/shell-drift-check.py"
      - "scripts/shell-a11y-check.py"
      - "scripts/storage-registry-gate.py"
      - "scripts/site-config-gate.py"
      - "scripts/_smoke_site_config.js"
      - "scripts/shell-bounds-check.py"
      - "scripts/_smoke_share_dialog.js"
      - "scripts/_promote_wave_1.py"
      - "scripts/_audit_wave_1.py"
      - "scripts/_smoke_wave_1_pages.js"
      - "scripts/_promote_wave_2.py"
      - "scripts/_audit_wave_2.py"
      - "scripts/_print_css_bootstrap.py"
      - "scripts/_smoke_wave_2_pages.js"
      - "scripts/_promote_wave_3.py"
      - "scripts/_audit_wave_3.py"
      - "scripts/_smoke_wave_3_pages.js"
