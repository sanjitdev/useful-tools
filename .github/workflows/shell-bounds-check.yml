name: Shell Bounds Check

# Story 1.14 — Shell Public API and Bypass Prohibition. This workflow
# enforces the Tool-side prohibition in docs/shell-public-api.md §2:
# code under tools/<slug>/<slug>.js must reach the registered HT.* APIs
# only — no direct localStorage / document.cookie / fetch / XMLHttpRequest
# / HT.provide / HT.sampleData / HT.reset calls. Inline <script> blocks
# in tools/<slug>/index.html are intentionally out of scope (FOUC IIFE
# grandfather + lifecycle fallback allowlist; see docs/shell-public-api.md §6).
#
# Story 2.2 — Per-Tool Sample Data and Reset Button. Extends the gate
# with the ad-hoc sample/reset button rule (data-ht-action attribute,
# setAttribute form, ARIA shortcut literals) and runs the sample-data
# smoke harness that exercises HT.sampleData / HT.reset surfaces in a
# fresh vm context.
#
# Story 2.3 — Per-Tool History Panel. Extends the path filter to cover
# assets/js/history.js + scripts/_smoke_history_panel.js and adds a
# step that exercises the HT.history surface (AD-14 frozen) plus
# push/list/restore/storage/replay/hasHistory/panel/button behaviors.
# The bypass check itself also gained HISTORY_KEY_{SET,PARSE}_RE patterns
# to prohibit direct localStorage writes/reads of the handy-tools.history.*
# key family (see scripts/shell-bounds-check.py + docs/shell-public-api.md §6).
#
# Source of truth: docs/shell-public-api.md (the policy doc)
#                 scripts/shell-bounds-check.py (the gate)

on:
  pull_request:
    paths:
      - "tools/**"
      - "tools.json"
      - "tools.schema.json"
      - "scripts/shell-bounds-check.py"
      - "scripts/_smoke_shell_public_api.js"
      - "scripts/_smoke_sample_data.js"
      - "scripts/_smoke_history_panel.js"
      - "scripts/_smoke_export.js"
      - "assets/js/sample-data.js"
      - "assets/js/history.js"
      - "assets/js/export.js"
      - "docs/shell-public-api.md"
      - "assets/js/shell.js"
      - "assets/js/api-contract.js"
      - "assets/js/utils.js"
      - "assets/js/storage-registry.js"
      - ".github/workflows/shell-bounds-check.yml"
      - "Makefile"
  push:
    branches: [ main ]
    paths:
      - "tools/**"
      - "tools.json"
      - "tools.schema.json"
      - "scripts/shell-bounds-check.py"
      - "scripts/_smoke_shell_public_api.js"
      - "scripts/_smoke_sample_data.js"
      - "scripts/_smoke_history_panel.js"
      - "scripts/_smoke_export.js"
      - "assets/js/sample-data.js"
      - "assets/js/history.js"
      - "assets/js/export.js"
      - "docs/shell-public-api.md"
      - "assets/js/shell.js"
      - "assets/js/api-contract.js"
      - "assets/js/utils.js"
      - "assets/js/storage-registry.js"
      - ".github/workflows/shell-bounds-check.yml"
      - "Makefile"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shell-bounds-check
  cancel-in-progress: false

jobs:
  bounds-check:
    name: Shell Bounds Check
    runs-on: ubuntu-latest

    # The bypass check is a pure-stdlib Python script; ~30s of CI
    # budget is generous (cold checkout + setup-python install).
    timeout-minutes: 5

    steps:
      # actions/checkout is pinned to a commit SHA for supply-chain
      # safety. The mutable tag v4.2.2 resolves to:
      #   11bd71901bbe5b1630ceea73d27597364c9af683
      # Bump the SHA only after auditing the new tag's diff against
      # the previously-pinned version.
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.11"

      # actions/setup-node is pinned to a commit SHA. The mutable tag
      # v4.1.0 resolves to:
      #   1e44f9385a0d5f4dee9b2c12e9a38e9d6b5e566d
      # Required for the Story 1.14 shell-bounds smoke step (Node
      # loads shell.js in a vm context to assert HT.provide / HT.use /
      # HT.net surface).
      - name: Setup Node
        uses: actions/setup-node@1e44f9385a0d5f4dee9b2c12e9a38e9d6b5e566d # v4.1.0
        with:
          node-version: "22"

      - name: Run bypass check
        # Story 1.14: fail the PR if any code under tools/<slug>/<slug>.js
        # reaches past the registered HT.* APIs. The script's exit code
        # propagates as the step's exit code; any non-zero result fails
        # the job and the PR check.
        run: make shell-bounds

      - name: Self-test the bypass check
        # The stripper + walker are subtle. The self-test exercises
        # 11 cases against known inputs (strings, comments, template
        # literals, mixed lines). Catches regressions to the
        # string/comment-aware scanner.
        run: make shell-bounds-self-test

      - name: Smoke shell.js Public API surface (Story 1.14)
        # Loads assets/js/shell.js in a fresh vm context with a stub
        # document, asserts the HT.provide / HT.use / HT.net surfaces
        # are frozen, the register/use round-trip works, and the
        # validation rules fire on bad input. 20 PASS expected.
        # Vacuous-pass guard (pass===0 && fail===0 → exit 1) means a
        # hollow run fails the gate.
        run: make shell-public-api-smoke

      - name: Smoke sample-data.js per-tool Sample + Reset (Story 2.2 / AD-4 + AD-14)
        # Loads utils → sample-data in a fresh vm context with stub
        # HTMLInputElement + HT.homeGrid, asserts the HT.sampleData / HT.reset
        # surfaces are frozen (AD-14), hasSample / fill return merged-or-default
        # for has-sample/default-only/none-of-either slugs with Object.freeze
        # holding under sloppy-mode mutation, button factories emit the right
        # data-ht-action + aria-label + destructive class, mount inserts the
        # sample/reset buttons into a .tool-actions row and tears them down,
        # api-contract.js pins version 1.5.0 + the 6 new entries, tools.json
        # carries a urlState.sample block on inflation-calculator and
        # qr-code-generator, and tools.schema.json declares urlState.sample
        # as an optional property. 54 PASS expected. Vacuous-pass guard
        # means a hollow run fails the gate.
        run: make sample-data-smoke

      - name: Smoke history.js per-tool History Panel (Story 2.3 / AD-4 + AD-14)
        # Loads url.js + history.js in a fresh vm context against a
        # synthetic HT.homeGrid + HT.storage facade, asserts the
        # HT.history surface (push, list, restore, clear, subscribe,
        # panel, button, hasHistory) is frozen (AD-14), push/list
        # round-trip with FIFO cap of 10 (FR-12), per-tool isolation,
        # the hasHistory AND-gate across the four matrix cases AC-5
        # specifies (has-both / has-keys-no-urlstate /
        # has-urlstate-no-keys / neither), panel + button factories
        # emit the right DOM + aria-* attributes, and api-contract.js
        # pins version 1.7.0 + 9 entries. 44 PASS expected.
        # Vacuous-pass guard (pass===0 && fail===0 → exit 1) catches
        # hollow runs.
        run: make history-smoke

      - name: Smoke export.js User Data Export (Story 3.7 / AD-4 + AD-14)
        # Loads assets/js/export.js in a fresh vm context against a
        # synthetic HT.storage facade + HT.homeGrid + HT.history + HT.toast
        # + stubbed Blob/URL.createObjectURL/revokeObjectURL/HT_SHELL_EMBED.
        # Asserts the frozen HT.export surface (run + version 1.0.0), the
        # internal HT_EXPORT_SCHEMA_VERSION handle, the payload assembly
        # (version, exportedAt, settings, history, favorites, recent, pins),
        # the validation-failure path (toast + console.error + no download),
        # the embed-mode guard (?embed=1 / HT_SHELL_EMBED), and the
        # api-contract pin (version 1.13.0 + HT.export entry).
        # 43 PASS expected. Vacuous-pass guard catches hollow runs.
        run: make export-smoke
